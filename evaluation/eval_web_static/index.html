  document.getElementById('sidebar').classList.toggle('open');
}

function updateSelectedCount() {
  const el = document.getElementById('selectedCount');
  if (el) el.textContent = selectedRuns.size;
}

function getMetricDisplayName(catKey, metricKey) {
  const alias = metricAliases[catKey + ':' + metricKey];
  if (alias) return alias;
  const cat = categories[catKey];
  return cat?.metrics?.[metricKey] || metricKey;
}

function getGroupDisplayName(groupValue) {
  return groupAliases[groupValue] || groupValue;
}

function _inlineEdit(el, currentText, onSave) {
  const input = document.createElement('input');
  input.type = 'text';
  input.value = currentText;
  input.style.cssText = 'font-size:inherit;padding:2px 4px;border:1px solid var(--accent);border-radius:3px;background:var(--bg);color:var(--text);width:' + Math.max(60, el.offsetWidth + 20) + 'px;';
  el.replaceWith(input);
  input.focus();
  input.select();
  const finish = () => {
    const newText = input.value.trim();
    onSave(newText);
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = currentText; input.blur(); }
  });
}

function editMetricTag(el, catKey, metricKey) {
  const origLabel = categories[catKey]?.metrics?.[metricKey] || metricKey;
  const currentLabel = metricAliases[catKey + ':' + metricKey] || origLabel;
  _inlineEdit(el, currentLabel, (newText) => {
    if (newText && newText !== origLabel) {
      metricAliases[catKey + ':' + metricKey] = newText;
    } else {
      delete metricAliases[catKey + ':' + metricKey];
    }
    onCategoryChange();  // re-render tags
  });
}

function editGroupTag(el, groupValue) {
  const currentLabel = groupAliases[groupValue] || groupValue;
  _inlineEdit(el, currentLabel, (newText) => {
    if (newText && newText !== groupValue) {
      groupAliases[groupValue] = newText;
    } else {
      delete groupAliases[groupValue];
    }
    // Re-render group tags
    _rerenderGroupTags();
  });
}

function _rerenderGroupTags() {
  if (availableGroups.length === 0) return;
  const groupPanel = document.getElementById('groupPanel');
  const catKey = document.getElementById('categorySelect').value;
  const cat = categories[catKey];
  if (!cat?.group_key) return;
  groupPanel.innerHTML = `
    <label style="font-size:12px; color:var(--text2);">按 ${cat.group_key} 筛选:</label>
    ${availableGroups.map(g => {
      const display = getGroupDisplayName(g);
      const escaped = g.replace(/'/g, "\\'");
      return `<span class="group-tag ${selectedGroups.has(g) ? 'active' : ''}" onclick="toggleGroup('${escaped}', this)" ondblclick="event.stopPropagation(); editGroupTag(this, '${escaped}')" title="双击重命名">${escapeHtml(display)}</span>`;
    }).join('')}
    <span style="font-size:11px; color:var(--text2); margin-left:8px;">（不选则显示全部，双击可重命名）</span>
  `;
}

// ──────── 初始化 ────────
async function init() {
  const [runsRes, catRes, aliasRes] = await Promise.all([
    fetch('/api/runs').then(r => r.json()),
    fetch('/api/categories').then(r => r.json()),
    fetch('/api/aliases').then(r => r.json()).catch(() => ({})),
  ]);
  allRuns = runsRes;
  categories = catRes;
  Object.assign(runAliases, aliasRes);
  renderRunsList();
  renderCategorySelect();
}

function renderRunsList() {
  const el = document.getElementById('runsList');
  el.innerHTML = allRuns.map(run => {
    const tom = run.config_summary?.tom_distribution || {};
    const tomStr = Object.entries(tom).map(([k,v]) => `T${k}:${v}`).join(' ');
    const alias = runAliases[run.name] || '';
    const escapedName = run.name.replace(/'/g, "\\'");
    return `
      <div class="run-item ${selectedRuns.has(run.name) ? 'selected' : ''}" onclick="toggleRun('${escapedName}', this)">
        <input type="checkbox" ${selectedRuns.has(run.name) ? 'checked' : ''} onclick="event.stopPropagation(); toggleRun('${escapedName}', this.parentElement)">
        <div style="flex:1;min-width:0;">
          <div class="run-name" title="${run.name}">${run.name}</div>
          <div class="run-meta">
            ${run.trading_days}天 · ${run.config_summary?.n_agents || '?'}人
            ${tomStr ? ' · ' + tomStr : ''}
            · ${run.config_summary?.cash_mode || '?'}
            <input class="alias-input" type="text" placeholder="别名" value="${alias}" onclick="event.stopPropagation()" onchange="setRunAlias('${escapedName}', this.value)">
          </div>
        </div>
      </div>
    `;
  }).join('');
  updateSelectedCount();
}

function renderCategorySelect() {
  const sel = document.getElementById('categorySelect');
  // 区分原始数据与计算型类别
  const rawCats = [];
  const computedCats = [];
  for (const [key, cat] of Object.entries(categories)) {
    if (cat.computed) {
      computedCats.push([key, cat]);
    } else {
      rawCats.push([key, cat]);
    }
  }
  let html = '<optgroup label="原始数据">';
  html += rawCats.map(([key, cat]) => `<option value="${key}">${cat.label}</option>`).join('');
  html += '</optgroup>';
  if (computedCats.length > 0) {
    html += '<optgroup label="学术指标（动态计算）">';
    html += computedCats.map(([key, cat]) => `<option value="${key}">${cat.label}</option>`).join('');
    html += '</optgroup>';
  }
  sel.innerHTML = html;
  onCategoryChange();
}

// ──────── 交互逻辑 ────────
function toggleRun(name, el) {
  if (selectedRuns.has(name)) {
    selectedRuns.delete(name);
  } else {
    selectedRuns.add(name);
  }
  renderRunsList();
}

function selectAllRuns() {
  allRuns.forEach(r => selectedRuns.add(r.name));
  renderRunsList();
}

function deselectAllRuns() {
  selectedRuns.clear();
  renderRunsList();
}

function onCategoryChange() {
  const catKey = document.getElementById('categorySelect').value;
  const cat = categories[catKey];
  if (!cat) return;

  // 渲染指标标签（带 tooltip）
  const panel = document.getElementById('metricsPanel');
  selectedMetrics.clear();
  const metricEntries = Object.entries(cat.metrics);
  const descs = cat.desc || {};
  // 默认选中第一个
  if (metricEntries.length > 0) selectedMetrics.add(metricEntries[0][0]);
  panel.innerHTML = metricEntries.map(([key, label]) => {
    const display = metricAliases[catKey + ':' + key] || label;
    const escaped = key.replace(/'/g, "\\'");
    return `<span class="metric-tag ${selectedMetrics.has(key) ? 'active' : ''}" data-key="${key}" onclick="toggleMetric('${escaped}', this)" ondblclick="event.stopPropagation(); editMetricTag(this, '${catKey}', '${escaped}')" title="双击重命名">${escapeHtml(display)}</span>`;
  }).join('') + `<button class="btn btn-xs desc-toggle" onclick="toggleDescPanel(this)">指标说明</button>`;

  // 渲染说明面板
  const descPanel = document.getElementById('descPanel');
  if (Object.keys(descs).length > 0) {
    const items = metricEntries.map(([key, label]) => {
      const d = descs[key] || '';
      return `<li><span class="desc-name">${label}</span><span class="desc-text">${d}</span></li>`;
    }).join('');
    descPanel.innerHTML = `<ul class="desc-list">${items}</ul>`;
  } else {
    descPanel.innerHTML = '<span>暂无说明</span>';
  }
  descPanel.classList.remove('show');

  // 分组面板
  const groupPanel = document.getElementById('groupPanel');
  const subplotLabel = document.getElementById('subplotLabel');
  const subplotToggle = document.getElementById('subplotToggle');
  // 重置分组依据下拉框
  const gbSel = document.getElementById('groupBySelect');
  gbSel.innerHTML = '<option value="">默认' + (cat.group_key ? `（${cat.group_key}）` : '（无）') + '</option>';
  if (cat.group_key) {
    groupPanel.style.display = 'flex';
    groupPanel.innerHTML = `<label style="font-size:12px; color:var(--text2);">按 ${cat.group_key} 筛选:</label><span style="font-size:11px; color:var(--text2);">（加载数据后显示可用选项）</span>`;
    selectedGroups.clear();
    availableGroups = [];
    subplotToggle.disabled = false;
    subplotLabel.style.opacity = '1';
    subplotLabel.title = `按 ${cat.group_key} 拆分为独立子图`;
  } else {
    groupPanel.style.display = 'none';
    selectedGroups.clear();
    availableGroups = [];
    subplotToggle.disabled = false;  // 不再禁用，用户可通过分组依据下拉框启用
    subplotLabel.style.opacity = '0.6';
    subplotLabel.title = '选择「分组依据」后可启用子图分离';
  }
}

function toggleMetric(key, el) {
  if (selectedMetrics.has(key)) {
    selectedMetrics.delete(key);
    el.classList.remove('active');
  } else {
    selectedMetrics.add(key);
    el.classList.add('active');
  }
}

function toggleDescPanel(btn) {
  const panel = document.getElementById('descPanel');
  panel.classList.toggle('show');
  btn.classList.toggle('active');
}

function toggleGroup(val, el) {
  if (selectedGroups.has(val)) {
    selectedGroups.delete(val);
    el.classList.remove('active');
  } else {
    selectedGroups.add(val);
    el.classList.add('active');
  }
}

// ──────── 图表生成 ────────
async function generateChart() {
  if (selectedRuns.size === 0) {
    showToast('请先选择至少一个实验', 'warn');
    return;
  }
  if (selectedMetrics.size === 0) {
    showToast('请先选择至少一个指标', 'warn');
    return;
  }

  const catKey = document.getElementById('categorySelect').value;
  const cat = categories[catKey];
  let chartType = document.getElementById('chartTypeSelect').value;
  const xMode = document.getElementById('xModeSelect').value;
  const isAgg = xMode !== 'timeseries';
  // 离散 x 轴或聚合模式自动切换为柱状图
  if ((cat.x_type === 'category' || isAgg) && (chartType === 'line' || chartType === 'line_smooth' || chartType === 'area')) chartType = 'bar';
  const runs = Array.from(selectedRuns).join(',');
  const metrics = Array.from(selectedMetrics).join(',');
  const groupFilter = Array.from(selectedGroups).join(',');

  // 自定义坐标轴名称
  const customXName = document.getElementById('customXAxisName').value.trim();
  const customYName = document.getElementById('customYAxisName').value.trim();
  const showXName = document.getElementById('showXAxisName').checked;
  const showYName = document.getElementById('showYAxisName').checked;
  function _axisXName(defaultName) { if (!showXName) return ''; return customXName || defaultName || ''; }
  function _axisYName(defaultName) { if (!showYName) return ''; return customYName || defaultName || ''; }

  const yScaleMode = document.getElementById('yScaleMode').value;
  // 纵轴变换函数: 对 [x,y] 数组做归一化/标准化/涨跌幅
  function _transformY(xyData) {
    if (yScaleMode === 'raw' || xyData.length === 0) return xyData;
    const ys = xyData.map(p => p[1]);
    if (yScaleMode === 'minmax') {
      const mn = Math.min(...ys), mx = Math.max(...ys);
      const range = mx - mn || 1;
      return xyData.map(p => [p[0], (p[1] - mn) / range]);
    }
    if (yScaleMode === 'zscore') {
      const mean = ys.reduce((a,b) => a+b, 0) / ys.length;
      const std = Math.sqrt(ys.reduce((a,v) => a + (v-mean)**2, 0) / ys.length) || 1;
      return xyData.map(p => [p[0], (p[1] - mean) / std]);
    }
    if (yScaleMode === 'pct_change') {
      const base = ys[0] || 1;
      return xyData.map(p => [p[0], ((p[1] - base) / Math.abs(base)) * 100]);
    }
    return xyData;
  }

  // 加载提示（所有类别统一显示）
  const genBtn = document.querySelector('.toolbar button:first-of-type');
  const origText = genBtn.textContent;
  genBtn.textContent = cat.computed ? '⏳ 计算中...' : '⏳ 加载中...';
  genBtn.disabled = true;

  const windowEnabled = document.getElementById('windowToggle').checked;
  const windowVal = windowEnabled ? document.getElementById('windowSelect').value : '';
  const groupByVal = document.getElementById('groupBySelect').value;
  let url = `/api/data?runs=${encodeURIComponent(runs)}&category=${catKey}&metrics=${metrics}&group_filter=${groupFilter}`;
  if (windowVal) url += `&window=${windowVal}`;
  if (groupByVal) url += `&group_by=${encodeURIComponent(groupByVal)}`;

  let data;
  try {
    const res = await fetch(url);
    data = await res.json();
  } finally {
    genBtn.textContent = origText;
    genBtn.disabled = false;
  }

  if (data.error) {
    showToast(data.error, 'error');
    return;
  }

  // 更新分组面板
  if (data.available_groups && data.available_groups.length > 0) {
    availableGroups = data.available_groups;
    _rerenderGroupTags();
  }

  // 更新分组依据下拉框
  if (data.available_group_keys) {
    const gbSel = document.getElementById('groupBySelect');
    const curVal = gbSel.value;
    gbSel.innerHTML = '<option value="">默认' + (cat.group_key ? `（${cat.group_key}）` : '（无）') + '</option>';
    data.available_group_keys.forEach(k => {
      const opt = document.createElement('option');
      opt.value = k;
      opt.textContent = k;
      if (k === curVal) opt.selected = true;
      gbSel.appendChild(opt);
    });
  }

  // 为每个选中的指标生成一个图表
  const chartArea = document.getElementById('chartArea');

  // 清掉空状态
  const emptyState = chartArea.querySelector('.empty-state');
  if (emptyState) emptyState.remove();

  const showGrid = document.getElementById('gridLineToggle').checked;
  const effectiveGroupKey = data.group_key || null;
  const subplotMode = document.getElementById('subplotToggle').checked && !!effectiveGroupKey;

  // ──────── 子图分离模式 ────────
  if (subplotMode) {
    for (const metricKey of selectedMetrics) {
      const metricLabel = cat.metrics[metricKey] || metricKey;  // for data matching
      const metricDisplay = getMetricDisplayName(catKey, metricKey);  // for user display
      const aggLabel = isAgg ? ({mean:'均值', sum:'总和', last:'最终值', max:'最大值', min:'最小值'}[xMode]) : null;

      // 收集所有分组值
      const allGroups = new Set();
      for (const runSeries of Object.values(data.series)) {
        for (const sLabel of Object.keys(runSeries)) {
          if (!sLabel.endsWith('_' + metricLabel)) continue;
          const gv = sLabel.slice(0, -(metricLabel.length + 1));
          if (gv) allGroups.add(gv);
        }
      }
      const groupList = Array.from(allGroups).sort();
      if (groupList.length === 0) continue;

      const runNames = Object.keys(data.series);
      const nCols = Math.min(5, groupList.length);
      const nRows = Math.ceil(groupList.length / nCols);
      const rowH = 250;
      const totalH = nRows * rowH + 30;
      const containerId = `chart_sub_${Date.now()}_${metricKey}`;
      const customTitle = document.getElementById('customTitleInput').value.trim();
      const chartTitle = customTitle || `${cat.label} — ${metricDisplay}${aggLabel ? '（' + aggLabel + '）' : ''} [按${effectiveGroupKey}子图分离]`;

      const container = _buildChartContainer(containerId, chartTitle, totalH);
      chartArea.insertBefore(container, chartArea.firstChild);
      const chart = echarts.init(document.getElementById(containerId));
      chartInstances.push(chart);

      const grids = [], xAxes = [], yAxes = [], seriesList = [], titles = [];
      const gapX = 3, gapY = 12, marginL = 5, marginR = 1, marginT = 1;
      const plotW = (100 - marginL - marginR - gapX * (nCols - 1)) / nCols;
      const plotH = (100 - marginT - gapY * nRows) / nRows;

      groupList.forEach((gv, i) => {
        const col = i % nCols;
        const row = Math.floor(i / nCols);
        const left = `${marginL + col * (plotW + gapX)}%`;
        const top = `${marginT + row * (plotH + gapY) + 4}%`;

        grids.push({ left, top, width: `${plotW}%`, height: `${plotH}%` });
        titles.push({
          text: getGroupDisplayName(gv),
          left: `${marginL + col * (plotW + gapX) + plotW / 2}%`,
          top: `${marginT + row * (plotH + gapY)}%`,
          textAlign: 'center',
          textStyle: { fontSize: 13, color: '#1f2328', fontWeight: 'bold' },
        });

        if (isAgg) {
          // 聚合：每个子图一个柱状图，x轴=run，y轴=聚合值
          const runLabels = runNames.map(rn => getRunDisplayName(rn));
          xAxes.push({ type: 'category', gridIndex: i, data: runLabels,
            axisLabel: { show: row === nRows - 1, color: '#656d76', fontSize: 9, rotate: runLabels.length > 3 ? 20 : 0 },
            axisLine: { lineStyle: { color: '#d0d7de' } }, splitLine: { show: false } });
          yAxes.push({ type: 'value', gridIndex: i, scale: true,
            axisLabel: { color: '#656d76', fontSize: 9 },
            axisLine: { lineStyle: { color: '#d0d7de' } },
            splitLine: { show: showGrid, lineStyle: { color: '#eaeef2' } } });

          const barData = runNames.map((rn, ri) => {
            const sKey = gv + '_' + metricLabel;
            const pts = (data.series[rn] || {})[sKey] || [];
            const yVals = pts.map(p => p.y);
            const v = _aggregate(yVals, xMode);
            return v != null ? Math.round(v * 10000) / 10000 : null;
          });
          seriesList.push({
            type: 'bar', xAxisIndex: i, yAxisIndex: i,
            data: barData.map((v, ri) => {
              const decal = BAR_DECALS[ri % BAR_DECALS.length];
              return { value: v, itemStyle: { color: COLORS[ri % COLORS.length], decal: decal } };
            }),
            label: { show: barData.length <= 6, position: 'top', color: '#656d76', fontSize: 9,
              formatter: p => _smartFmt(p.value) },
          });
        } else {
          // 时间序列：每个子图按run画线
          xAxes.push({ type: 'value', gridIndex: i, minInterval: 1,
            axisLabel: { show: row === nRows - 1, color: '#656d76', fontSize: 9 },
            axisLine: { lineStyle: { color: '#d0d7de' } }, splitLine: { show: false } });
          yAxes.push({ type: 'value', gridIndex: i, scale: true,
            axisLabel: { color: '#656d76', fontSize: 9 },
            axisLine: { lineStyle: { color: '#d0d7de' } },
            splitLine: { show: showGrid, lineStyle: { color: '#eaeef2' } } });

          runNames.forEach((rn, ri) => {
            const sKey = gv + '_' + metricLabel;
            const pts = (data.series[rn] || {})[sKey];
            if (!pts || pts.length === 0) return;
            seriesList.push({
              name: getRunDisplayName(rn), type: 'line',
              symbol: LINE_SYMBOLS[ri % LINE_SYMBOLS.length],
              symbolSize: 6,
              showSymbol: pts.length <= 120,
              xAxisIndex: i, yAxisIndex: i,
              lineStyle: { width: 1.5, color: COLORS[ri % COLORS.length], type: LINE_DASHES[ri % LINE_DASHES.length] },
              itemStyle: { color: COLORS[ri % COLORS.length] },
              data: _transformY(pts.map(p => [p.x, p.y])),
            });
          });
        }
      });

      chart.setOption({
        backgroundColor: 'transparent',
        aria: { enabled: true, decal: { show: true } },
        title: titles,
        tooltip: { trigger: 'axis', backgroundColor: '#ffffff', borderColor: '#d0d7de',
          textStyle: { color: '#1f2328', fontSize: 11 }, confine: true,
          valueFormatter: v => _smartFmt(v) },
        legend: runNames.length > 1 ? {
          type: 'scroll', top: 0, right: 20, itemWidth: 36, itemHeight: 10,
          data: runNames.map(rn => getRunDisplayName(rn)),
          textStyle: { color: '#656d76', fontSize: 10 }
        } : undefined,
        grid: grids, xAxis: xAxes, yAxis: yAxes, series: seriesList,
      });
      _autoYAxisGap(chart);
      _saveDefaultAxisNames(chart);
      _makeChartResizable(container);
      if (seriesList.some(s => s.type === 'bar')) _showBarWidthCtrl(container);
    }
    return; // 子图模式结束
  }

  // ──────── 聚合模式处理 ────────
  if (isAgg) {
    for (const metricKey of selectedMetrics) {
      const metricLabel = cat.metrics[metricKey] || metricKey;  // for data matching
      const metricDisplay = getMetricDisplayName(catKey, metricKey);  // for user display
      const containerId = `chart_${Date.now()}_${metricKey}`;
      const aggLabel = {mean:'均值', sum:'总和', last:'最终值', max:'最大值', min:'最小值'}[xMode];
      const customTitle = document.getElementById('customTitleInput').value.trim();
      const chartTitle = customTitle || `${cat.label} — ${metricDisplay}（${aggLabel}）`;

      // 收集所有 x 轴分类标签和对应值
      // 如果有 group_key: x 轴 = group values, 每个 run 一组柱
      // 如果无 group_key: x 轴 = run names, 单组柱
      const hasGroup = !!effectiveGroupKey;
      const xLabels = [];
      const runSeriesMap = {}; // {displayRunName: {xLabel: aggValue}}

      for (const [runName, runSeries] of Object.entries(data.series)) {
        const runDisplay = getRunDisplayName(runName);
        runSeriesMap[runDisplay] = {};
        for (const [seriesLabel, points] of Object.entries(runSeries)) {
          if (!seriesLabel.includes(metricLabel) && !seriesLabel.endsWith(metricLabel)) continue;
          const yVals = points.map(p => p.y);
          let aggVal = _aggregate(yVals, xMode);
          if (aggVal == null) continue;
          aggVal = Math.round(aggVal * 10000) / 10000;

          // 提取 group label（去掉尾部的 _metricLabel）
          let xLabel;
          if (hasGroup) {
            xLabel = seriesLabel.replace(`_${metricLabel}`, '').replace(new RegExp(`_${metricLabel.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}$`), '');
            if (xLabel === seriesLabel) xLabel = seriesLabel; // fallback
          } else {
            xLabel = runDisplay;
          }
          if (!xLabels.includes(xLabel)) xLabels.push(xLabel);
          runSeriesMap[runDisplay][xLabel] = aggVal;
        }
      }

      // 构建 ECharts 配置
      const container = _buildChartContainer(containerId, chartTitle);
      chartArea.insertBefore(container, chartArea.firstChild);
      const chart = echarts.init(document.getElementById(containerId));
      chartInstances.push(chart);

      const seriesList = [];
      let colorIdx = 0;
      if (hasGroup) {
        const nRuns = Object.keys(runSeriesMap).length;
        for (const [runDisplay, vals] of Object.entries(runSeriesMap)) {
          if (nRuns === 1 && xLabels.length <= 20) {
            // 单 run: 逐柱子独立颜色+花纹，方便黑白区分
            seriesList.push({
              name: runDisplay,
              type: 'bar',
              data: xLabels.map((xl, xi) => ({
                value: vals[xl] ?? null,
                itemStyle: { color: COLORS[xi % COLORS.length], decal: BAR_DECALS[xi % BAR_DECALS.length] },
              })),
              label: { show: xLabels.length <= 10, position: 'top', color: '#656d76', fontSize: 10, formatter: p => _smartFmt(p.value) },
            });
          } else {
            // 多 run: 每个 run 一种花纹
            const decal = BAR_DECALS[colorIdx % BAR_DECALS.length];
            seriesList.push({
              name: runDisplay,
              type: 'bar',
              data: xLabels.map(xl => vals[xl] ?? null),
              itemStyle: { color: COLORS[colorIdx % COLORS.length], decal: decal },
              label: { show: xLabels.length <= 10, position: 'top', color: '#656d76', fontSize: 10, formatter: p => _smartFmt(p.value) },
            });
          }
          colorIdx++;
        }
      } else {
        // 无 group: 每个 run 一个柱
        const vals = xLabels.map(xl => {
          for (const rMap of Object.values(runSeriesMap)) {
            if (rMap[xl] != null) return rMap[xl];
          }
          return null;
        });
        seriesList.push({
          name: metricDisplay,
          type: 'bar',
          data: vals.map((v, idx) => ({
            value: v,
            itemStyle: {
              color: COLORS[idx % COLORS.length],
              decal: BAR_DECALS[idx % BAR_DECALS.length]
            }
          })),
          label: { show: true, position: 'top', color: '#656d76', fontSize: 10, formatter: p => _smartFmt(p.value) },
        });
      }

      chart.setOption({
        backgroundColor: 'transparent',
        aria: { enabled: true, decal: { show: true } },
        tooltip: { trigger: 'axis', backgroundColor: '#ffffff', borderColor: '#d0d7de', textStyle: { color: '#1f2328', fontSize: 12 }, valueFormatter: v => _smartFmt(v) },
        legend: { type: 'scroll', top: 8, itemWidth: 36, itemHeight: 10, textStyle: { color: '#656d76', fontSize: 11 } },
        grid: { top: 50, right: 20, bottom: 60, left: 60, containLabel: true },
        xAxis: { type: 'category', data: hasGroup ? xLabels.map(xl => getGroupDisplayName(xl)) : xLabels, name: _axisXName(''), nameLocation: 'center', nameGap: 30, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76', rotate: xLabels.length > 6 ? 25 : 0, fontSize: 11 } },
        yAxis: { type: 'value', name: _axisYName(`${metricDisplay}（${aggLabel}）`), nameLocation: 'center', nameGap: 50, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, splitLine: { show: document.getElementById('gridLineToggle').checked, lineStyle: { color: '#eaeef2' } } },
        series: seriesList,
      });
      _autoYAxisGap(chart);
      _saveDefaultAxisNames(chart);
      _showBarWidthCtrl(container);
    }
    return; // 聚合模式结束
  }

  const yScaleSuffix = {raw:'', minmax:' [归一化]', zscore:' [标准化]', pct_change:' [涨跌幅%]'}[yScaleMode] || '';

  // ──────── 双Y轴模式：2个指标合并一张图 ────────
  const dualY = document.getElementById('dualYToggle').checked;
  if (dualY && selectedMetrics.size === 2 && cat.x_type !== 'category') {
    const metricKeys = Array.from(selectedMetrics);
    const metricLabels = metricKeys.map(k => cat.metrics[k] || k);
    const metricDisplays = metricKeys.map(k => getMetricDisplayName(catKey, k));
    const containerId = `chart_dual_${Date.now()}`;
    const customTitle = document.getElementById('customTitleInput').value.trim();
    const chartTitle = customTitle || `${cat.label} — ${metricDisplays[0]} vs ${metricDisplays[1]}`;

    const container = _buildChartContainer(containerId, chartTitle);
    chartArea.insertBefore(container, chartArea.firstChild);
    const chart = echarts.init(document.getElementById(containerId));
    chartInstances.push(chart);

    const showGrid = document.getElementById('gridLineToggle').checked;
    const seriesList = [];
    let colorIdx = 0;

    metricKeys.forEach((mk, mi) => {
      const mLabel = metricLabels[mi];
      for (const [runName, runSeries] of Object.entries(data.series)) {
        for (const [seriesLabel, points] of Object.entries(runSeries)) {
          if (!seriesLabel.includes(mLabel) && Object.keys(data.series).length > 1) {
            if (!seriesLabel.endsWith(mLabel)) continue;
          }
          const displayName = Object.keys(data.series).length > 1
            ? `${getRunDisplayName(runName)} · ${seriesLabel}`
            : seriesLabel;
          const xyData = _transformY(points.map(p => [p.x, p.y]));
          const isLine = (chartType === 'line' || chartType === 'line_smooth' || chartType === 'area');
          const isBar = (chartType === 'bar');
          const barDecal = isBar ? BAR_DECALS[colorIdx % BAR_DECALS.length] : undefined;
          // 柱状图且数据点少时逐柱分配不同花纹
          const barData = (isBar && xyData.length <= 20)
            ? xyData.map((pt, pi) => ({ value: pt, itemStyle: { color: COLORS[pi % COLORS.length], decal: BAR_DECALS[pi % BAR_DECALS.length] } }))
            : xyData;
          seriesList.push({
            name: displayName,
            type: chartType === 'area' ? 'line' : chartType === 'line_smooth' ? 'line' : chartType,
            yAxisIndex: mi,
            data: barData,
            smooth: chartType === 'line_smooth',
            areaStyle: chartType === 'area' ? { opacity: 0.15 } : undefined,
            symbol: isLine ? LINE_SYMBOLS[colorIdx % LINE_SYMBOLS.length] : 'none',
            symbolSize: isLine ? 6 : 0,
            showSymbol: isLine ? xyData.length <= 120 : undefined,
            lineStyle: { width: 2, type: isLine ? LINE_DASHES[colorIdx % LINE_DASHES.length] : undefined },
            itemStyle: { color: COLORS[colorIdx % COLORS.length], decal: barDecal },
          });
          colorIdx++;
        }
      }
    });

    const option = {
      backgroundColor: 'transparent',
      aria: { enabled: true, decal: { show: true } },
      tooltip: { trigger: 'axis', backgroundColor: '#ffffff', borderColor: '#d0d7de', textStyle: { color: '#1f2328', fontSize: 12 }, confine: true, valueFormatter: v => _smartFmt(v) },
      legend: { type: 'scroll', top: 8, itemWidth: 36, itemHeight: 10, textStyle: { color: '#656d76', fontSize: 11 }, pageTextStyle: { color: '#656d76' } },
      grid: { top: 50, right: 80, bottom: 40, left: 60, containLabel: true },
      xAxis: { type: 'value', name: _axisXName(data.x_label), nameLocation: 'center', nameGap: 25, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, minInterval: 1 },
      yAxis: [
        { type: 'value', name: _axisYName(metricDisplays[0] + yScaleSuffix), nameLocation: 'center', nameGap: 50, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, splitLine: { show: showGrid, lineStyle: { color: '#eaeef2' } } },
        { type: 'value', name: _axisYName(metricDisplays[1] + yScaleSuffix), nameLocation: 'center', nameGap: 50, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, splitLine: { show: false } },
      ],
      dataZoom: [
        { type: 'inside', xAxisIndex: 0 },
        { type: 'slider', xAxisIndex: 0, height: 20, bottom: 5, borderColor: '#d0d7de', backgroundColor: '#ffffff', fillerColor: 'rgba(9,105,218,0.1)', handleStyle: { color: '#0969da' }, textStyle: { color: '#656d76' } }
      ],
      series: seriesList,
    };

    chart.setOption(option);
    _autoYAxisGap(chart);
    _saveDefaultAxisNames(chart);
    _makeChartResizable(container);
    return;
  }

  for (const metricKey of selectedMetrics) {
    const metricLabel = cat.metrics[metricKey] || metricKey;  // for data matching
    const metricDisplay = getMetricDisplayName(catKey, metricKey);  // for user display
    const containerId = `chart_${Date.now()}_${metricKey}`;

    const customTitle = document.getElementById('customTitleInput').value.trim();
    const chartTitle = customTitle || `${cat.label} — ${metricDisplay}`;

    const container = _buildChartContainer(containerId, chartTitle);
    chartArea.insertBefore(container, chartArea.firstChild);

    const chart = echarts.init(document.getElementById(containerId));
    chartInstances.push(chart);

    // 构建系列
    const seriesList = [];
    let colorIdx = 0;

    // ── 跨实验单点对比: category + 无group_key + 每run仅1点 → 合并为单series ──
    const isCrossCmp = cat.x_type === 'category' && !effectiveGroupKey
      && Object.keys(data.series).length > 1
      && Object.values(data.series).every(rs => {
           const pts = Object.values(rs).find(p => Array.isArray(p));
           return pts && pts.length <= 1;
         });

    if (isCrossCmp) {
      const xLabels = [];
      const yValues = [];
      for (const [runName, runSeries] of Object.entries(data.series)) {
        for (const [seriesLabel, points] of Object.entries(runSeries)) {
          if (!seriesLabel.includes(metricLabel) && !seriesLabel.endsWith(metricLabel)) continue;
          if (points.length > 0) {
            const label = runName;
            xLabels.push(label);
            yValues.push(points[0].y);
          }
        }
      }
      seriesList.push({
        name: metricDisplay,
        type: 'bar',
        data: yValues.map((v, idx) => ({
          value: v,
          itemStyle: { color: COLORS[idx % COLORS.length], decal: BAR_DECALS[idx % BAR_DECALS.length] },
        })),
        label: { show: true, position: 'top', color: '#656d76', fontSize: 11,
          formatter: p => _smartFmt(p.value)
        },
        markLine: { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: '#cf222e', width: 1.5 },
          data: [{ yAxis: 100, label: { formatter: '基准 100', fontSize: 10, color: '#cf222e' } }],
        },
      });

      const option = {
        backgroundColor: 'transparent',
        aria: { enabled: true, decal: { show: true } },
        tooltip: { trigger: 'axis', backgroundColor: '#ffffff', borderColor: '#d0d7de', textStyle: { color: '#1f2328', fontSize: 12 }, confine: true, valueFormatter: v => _smartFmt(v) },
        legend: { show: false },
        grid: { top: 40, right: 20, bottom: 80, left: 60, containLabel: true },
        xAxis: { type: 'category', data: xLabels, name: _axisXName('ToM 比例'), nameLocation: 'center', nameGap: 65, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76', rotate: xLabels.length > 5 ? 25 : 0, fontSize: 11, interval: 0 } },
        yAxis: { type: 'value', name: _axisYName(metricDisplay), nameLocation: 'center', nameGap: 50, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, splitLine: { show: document.getElementById('gridLineToggle').checked, lineStyle: { color: '#eaeef2' } } },
        series: seriesList,
      };
      chart.setOption(option);
      _autoYAxisGap(chart);
      _saveDefaultAxisNames(chart);
      _makeChartResizable(container);
      _showBarWidthCtrl(container);
      continue; // 跳过后续通用渲染逻辑
    }

    // ── 跨实验分组对比: category + group_key + 多run + 每run少量点 → 紧凑分组柱 ──
    const isGroupedCrossCmp = cat.x_type === 'category' && effectiveGroupKey
      && Object.keys(data.series).length > 1
      && Object.values(data.series).every(rs =>
           Object.values(rs).every(pts => Array.isArray(pts) && pts.length <= 5));

    if (isGroupedCrossCmp) {
      // 收集: xLabels = 各实验标签, groups = 所有 group 值
      const xLabelsG = [];
      const groupsSet = new Set();
      const runDataMap = {}; // label -> { groupVal -> yValue }
      for (const [runName, runSeries] of Object.entries(data.series)) {
        const runDisplay = getRunDisplayName(runName);
        let xVal = null;
        const gMap = {};
        for (const [seriesLabel, points] of Object.entries(runSeries)) {
          if (!seriesLabel.includes(metricLabel) && !seriesLabel.endsWith(metricLabel)) continue;
          for (const p of points) {
            if (xVal === null) xVal = p.x;
            // seriesLabel 格式: "groupVal_metricLabel" (如 "0_人均收益率(%)")
            const uIdx = seriesLabel.indexOf('_');
            const groupVal = uIdx >= 0 ? seriesLabel.substring(0, uIdx).trim() : seriesLabel;
            gMap[groupVal] = p.y;
            groupsSet.add(groupVal);
          }
        }
        if (xVal !== null) {
          xLabelsG.push(runName);
          runDataMap[runName] = gMap;
        }
      }
      const groups = [...groupsSet].sort();
      const _gLabel = g => /^\d+$/.test(g) && effectiveGroupKey === 'tom_level' ? `ToM ${g}` : g;

      const seriesListG = groups.map((g, gi) => ({
        name: _gLabel(g),
        type: 'bar',
        data: xLabelsG.map(xl => runDataMap[xl][g] ?? null),
        itemStyle: { color: COLORS[gi % COLORS.length], decal: BAR_DECALS[gi % BAR_DECALS.length] },
        label: { show: true, position: 'top', color: '#656d76', fontSize: 10, formatter: p => p.value != null ? _smartFmt(p.value) : '' },
        barGap: '15%',
        barCategoryGap: '30%',
      }));

      const optionG = {
        backgroundColor: 'transparent',
        aria: { enabled: true, decal: { show: true } },
        tooltip: { trigger: 'axis', backgroundColor: '#ffffff', borderColor: '#d0d7de', textStyle: { color: '#1f2328', fontSize: 12 }, confine: true, valueFormatter: v => _smartFmt(v) },
        legend: { type: 'scroll', top: 8, itemWidth: 20, itemHeight: 10, textStyle: { color: '#656d76', fontSize: 11 } },
        grid: { top: 50, right: 20, bottom: 80, left: 60, containLabel: true },
        xAxis: { type: 'category', data: xLabelsG, name: _axisXName('ToM 比例'), nameLocation: 'center', nameGap: 65, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76', rotate: xLabelsG.length > 5 ? 25 : 0, fontSize: 11, interval: 0 } },
        yAxis: { type: 'value', name: _axisYName(metricDisplay), nameLocation: 'center', nameGap: 50, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, splitLine: { show: document.getElementById('gridLineToggle').checked, lineStyle: { color: '#eaeef2' } } },
        series: seriesListG,
      };
      chart.setOption(optionG);
      _autoYAxisGap(chart);
      _saveDefaultAxisNames(chart);
      _makeChartResizable(container);
      _showBarWidthCtrl(container);
      continue;
    }

    for (const [runName, runSeries] of Object.entries(data.series)) {
      for (const [seriesLabel, points] of Object.entries(runSeries)) {
        // 只取当前指标对应的系列
        if (!seriesLabel.includes(metricLabel) && Object.keys(data.series).length > 1) {
          if (!seriesLabel.endsWith(metricLabel)) continue;
        }

        const displayName = Object.keys(data.series).length > 1
          ? `${getRunDisplayName(runName)} · ${seriesLabel}`
          : seriesLabel;

        const xyData = _transformY(points.map(p => [p.x, p.y]));

        // 排名图配色: Top10=绿, Bottom10=红
        let itemColor = COLORS[colorIdx % COLORS.length];
        if (seriesLabel.includes('Top10')) itemColor = '#1a7f37';
        else if (seriesLabel.includes('Bottom10')) itemColor = '#cf222e';

        const isLine = (chartType === 'line' || chartType === 'line_smooth' || chartType === 'area');
        const seriesOpt = {
          name: displayName,
          type: chartType === 'area' ? 'line' : chartType === 'line_smooth' ? 'line' : chartType,
          data: xyData,
          smooth: chartType === 'line_smooth',
          areaStyle: chartType === 'area' ? { opacity: 0.15 } : undefined,
          symbol: chartType === 'scatter' ? 'circle' : isLine ? LINE_SYMBOLS[colorIdx % LINE_SYMBOLS.length] : 'none',
          symbolSize: chartType === 'scatter' ? 4 : isLine ? 6 : 0,
          showSymbol: isLine ? xyData.length <= 120 : undefined,
          lineStyle: { width: 2, type: isLine ? LINE_DASHES[colorIdx % LINE_DASHES.length] : undefined },
          itemStyle: { color: itemColor },
        };
        seriesList.push(seriesOpt);
        colorIdx++;
      }
    }

    const option = {
      backgroundColor: 'transparent',
      aria: { enabled: true, decal: { show: true } },
      tooltip: { trigger: 'axis', backgroundColor: '#ffffff', borderColor: '#d0d7de', textStyle: { color: '#1f2328', fontSize: 12 }, confine: true, valueFormatter: v => _smartFmt(v) },
      legend: { type: 'scroll', top: 8, itemWidth: 36, itemHeight: 10, textStyle: { color: '#656d76', fontSize: 11 }, pageTextStyle: { color: '#656d76' } },
      grid: { top: 50, right: 20, bottom: cat.x_type === 'category' ? 80 : 40, left: 60, containLabel: true },
      xAxis: cat.x_type === 'category'
        ? { type: 'category', name: _axisXName(''), nameLocation: 'center', nameGap: 30, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76', rotate: 35, fontSize: 10, interval: 0 } }
        : { type: 'value', name: _axisXName(data.x_label), nameLocation: 'center', nameGap: 25, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, minInterval: 1 },
      yAxis: { type: 'value', name: _axisYName(metricDisplay + yScaleSuffix), nameLocation: 'center', nameGap: 50, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, splitLine: { show: document.getElementById('gridLineToggle').checked, lineStyle: { color: '#eaeef2' } } },
      dataZoom: cat.x_type === 'category' ? [] : [
        { type: 'inside', xAxisIndex: 0 },
        { type: 'slider', xAxisIndex: 0, height: 20, bottom: 5, borderColor: '#d0d7de', backgroundColor: '#ffffff', fillerColor: 'rgba(9,105,218,0.1)', handleStyle: { color: '#0969da' }, textStyle: { color: '#656d76' } }
      ],
      series: seriesList,
    };

    chart.setOption(option);
    _autoYAxisGap(chart);
    _saveDefaultAxisNames(chart);
    _makeChartResizable(container);
    if (seriesList.some(s => s.type === 'bar')) _showBarWidthCtrl(container);
  }
}

function setRunAlias(name, alias) {
  alias = alias.trim();
  if (alias) {
    runAliases[name] = alias;
  } else {
    delete runAliases[name];
  }
  // 持久化到后端
  fetch('/api/aliases', {
    method: 'PUT',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(runAliases),
  }).catch(e => console.warn('alias save failed', e));
}

function getRunDisplayName(name) {
  if (runAliases[name]) return runAliases[name];
  return shortRunName(name);
}

function shortRunName(name) {
  // 截取前 20 字符 + 尾部标识
  if (name.length <= 30) return name;
  return name.substring(0, 15) + '..' + name.substring(name.length - 12);
}

function removeChart(btn) {
  const container = btn.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const idx = chartInstances.findIndex(c => c.getDom() === chartDiv);
  if (idx >= 0) {
    chartInstances[idx].dispose();
    chartInstances.splice(idx, 1);
  }
  container.remove();
}

function adjustBarWidth(slider) {
  const container = slider.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;
  const val = slider.value + '%';
  slider.nextElementSibling.textContent = val;
  const opt = chart.getOption();
  const series = (opt.series || []).map(s => {
    if (s.type === 'bar') return { ...s, barWidth: val };
    return s;
  });
  chart.setOption({ series }, { replaceMerge: ['series'] });
}

function adjustBarGap(slider) {
  const container = slider.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;
  const val = slider.value + '%';
  slider.nextElementSibling.textContent = val;
  const opt = chart.getOption();
  const series = (opt.series || []).map(s => {
    if (s.type === 'bar') return { ...s, barCategoryGap: val };
    return s;
  });
  chart.setOption({ series }, { replaceMerge: ['series'] });
}

function _makeChartResizable(container) {
  const chartDiv = container.querySelector('.chart-box') || container;
  if (chartDiv && !chartDiv.classList.contains('resizable')) {
    chartDiv.classList.add('resizable');
    const ro = new ResizeObserver(() => {
      const chart = chartInstances.find(c => c.getDom() === chartDiv);
      if (chart) {
        chart.resize();
        _autoYAxisGap(chart);
      }
    });
    ro.observe(chartDiv);
  }
}

function _showBarWidthCtrl(container) {
  const ctrl = container.querySelector('.bar-width-ctrl');
  if (ctrl) ctrl.style.display = '';
  _makeChartResizable(container);
}

function applyChartWidth(pct) {
  pct = Math.max(20, Math.min(100, parseInt(pct) || 100));
  document.getElementById('chartWidthPct').value = pct;
  document.querySelectorAll('.chart-box').forEach(box => {
    box.style.width = pct + '%';
  });
  chartInstances.forEach(c => c.resize());
}

function editChartTitle(span) {
  const oldText = span.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'title-edit';
  input.value = oldText;
  span.replaceWith(input);
  input.focus();
  input.select();
  const finish = () => {
    const newText = input.value.trim() || oldText;
    const newSpan = document.createElement('span');
    newSpan.className = 'title-text';
    newSpan.textContent = newText;
    newSpan.title = '点击编辑标题';
    newSpan.onclick = () => editChartTitle(newSpan);
    input.replaceWith(newSpan);
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = oldText; input.blur(); }
  });
}

function toggleSeriesRename(btn) {
  const container = btn.closest('.chart-container');
  const panel = container.querySelector('.series-rename-panel');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;

  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    return;
  }

  const opt = chart.getOption();
  const series = opt.series || [];
  panel.innerHTML = '';
  series.forEach((s, i) => {
    if (!s.name) return;
    const color = (s.itemStyle && s.itemStyle.color) || '#999';
    const item = document.createElement('span');
    item.className = 'series-rename-item';
    item.innerHTML = `<span class="swatch" style="background:${typeof color === 'string' ? color : '#999'}"></span>`;
    const inp = document.createElement('input');
    inp.type = 'text';
    inp.value = s.name;
    inp.title = '修改后回车确认';
    const applySeries = () => {
      const newName = inp.value.trim();
      if (!newName || newName === s.name) return;
      const oldName = s.name;
      // 更新 series name（需要按索引对齐）
      const seriesUpdate = [];
      for (let j = 0; j < series.length; j++) {
        seriesUpdate.push(j === i ? { name: newName } : {});
      }
      // 更新 legend data
      const curOpt = chart.getOption();
      const legendUpdate = {};
      if (curOpt.legend && curOpt.legend[0] && curOpt.legend[0].data) {
        const legData = curOpt.legend[0].data.slice();
        const li = legData.indexOf(oldName);
        if (li >= 0) legData[li] = newName;
        legendUpdate.data = legData;
      }
      chart.setOption({
        series: seriesUpdate,
        legend: [Object.keys(legendUpdate).length ? legendUpdate : {}],
      }, false);
      s.name = newName;
    };
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); applySeries(); inp.blur(); }
    });
    inp.addEventListener('blur', applySeries);
    item.appendChild(inp);
    panel.appendChild(item);
  });

  // ── 如果 xAxis 是 category 且有 data，追加 x 轴标签改名 + 排序 ──
  const xAxisOpt = (opt.xAxis && opt.xAxis[0]) || {};
  if (xAxisOpt.type === 'category' && Array.isArray(xAxisOpt.data) && xAxisOpt.data.length > 0) {
    const divider = document.createElement('div');
    divider.style.cssText = 'width:100%;border-top:1px solid var(--border);margin:6px 0;font-size:11px;color:var(--text2);padding-top:4px;';
    divider.textContent = '横轴标签 (可改名 / ◀▶ 移动顺序):';
    panel.appendChild(divider);

    const labelContainer = document.createElement('div');
    labelContainer.style.cssText = 'display:flex;flex-direction:column;gap:3px;width:100%;';
    panel.appendChild(labelContainer);

    function _rebuildLabelRows() {
      labelContainer.innerHTML = '';
      const curOpt = chart.getOption();
      const curLabels = curOpt.xAxis[0].data.slice();
      curLabels.forEach((_lbl, idx) => {
        const item = document.createElement('span');
        item.className = 'series-rename-item';
        item.style.cssText = 'display:flex;align-items:center;gap:4px;';
        // 左箭头
        const btnL = document.createElement('button');
        btnL.textContent = '◀';
        btnL.title = '左移';
        btnL.disabled = idx === 0;
        btnL.style.cssText = 'cursor:pointer;border:1px solid var(--border);background:var(--bg2);border-radius:3px;padding:1px 5px;font-size:12px;' + (idx === 0 ? 'opacity:.3;' : '');
        btnL.onclick = () => _swapBars(idx, idx - 1);
        // 右箭头
        const btnR = document.createElement('button');
        btnR.textContent = '▶';
        btnR.title = '右移';
        btnR.disabled = idx === curLabels.length - 1;
        btnR.style.cssText = 'cursor:pointer;border:1px solid var(--border);background:var(--bg2);border-radius:3px;padding:1px 5px;font-size:12px;' + (idx === curLabels.length - 1 ? 'opacity:.3;' : '');
        btnR.onclick = () => _swapBars(idx, idx + 1);
        // 输入框
        const inp = document.createElement('input');
        inp.type = 'text';
        inp.value = typeof _lbl === 'string' ? _lbl.replace(/\n/g, ' ') : String(_lbl);
        inp.title = '修改后回车确认';
        inp.style.cssText = 'flex:1;';
        const applyLabel = () => {
          const newLabel = inp.value.trim();
          if (!newLabel) return;
          const co = chart.getOption();
          const cd = co.xAxis[0].data.slice();
          cd[idx] = newLabel;
          chart.setOption({ xAxis: [{ data: cd }] }, false);
        };
        inp.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') { e.preventDefault(); applyLabel(); inp.blur(); }
        });
        inp.addEventListener('blur', applyLabel);

        item.appendChild(btnL);
        item.appendChild(inp);
        item.appendChild(btnR);
        labelContainer.appendChild(item);
      });
    }

    function _swapBars(i, j) {
      const co = chart.getOption();
      const labels = co.xAxis[0].data.slice();
      [labels[i], labels[j]] = [labels[j], labels[i]];
      const seriesUpdate = co.series.map(s => {
        const d = (s.data || []).slice();
        if (d.length > Math.max(i, j)) { [d[i], d[j]] = [d[j], d[i]]; }
        return { data: d };
      });
      chart.setOption({ xAxis: [{ data: labels }], series: seriesUpdate }, false);
      _rebuildLabelRows();
    }

    _rebuildLabelRows();
  }

  panel.classList.add('show');
}

// ──────── 曲线样式自定义面板 ────────
const SYMBOL_OPTIONS = [
  {v:'circle',l:'●圆'},  {v:'rect',l:'■方'},  {v:'triangle',l:'▲三角'},
  {v:'diamond',l:'◆菱形'}, {v:'pin',l:'📍钉'},  {v:'arrow',l:'➤箭头'},
  {v:'roundRect',l:'▢圆方'}, {v:'emptyCircle',l:'○空圆'}, {v:'emptyRect',l:'□空方'},
  {v:'emptyTriangle',l:'△空三角'}, {v:'emptyDiamond',l:'◇空菱'}, {v:'none',l:'无'},
];
const DASH_OPTIONS = [
  {v:'solid',l:'实线'}, {v:'dashed',l:'虚线'}, {v:'dotted',l:'点线'},
  {v:'10,4',l:'长虚线'}, {v:'8,3,2,3',l:'点划线'}, {v:'4,2',l:'短虚线'}, {v:'12,4,4,4',l:'长点划'},
];
function _parseDash(v) {
  if (v === 'solid' || v === 'dashed' || v === 'dotted') return v;
  return v.split(',').map(Number);
}
function _dashToStr(d) {
  if (typeof d === 'string') return d;
  if (Array.isArray(d)) return d.join(',');
  return 'solid';
}

function toggleLegend(btn) {
  const container = btn.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;
  const opt = chart.getOption();
  const legend = opt.legend && opt.legend[0];
  const isShown = legend ? legend.show !== false : true;
  chart.setOption({ legend: { show: !isShown } }, false);
  btn.style.opacity = isShown ? '0.5' : '1';
}

function toggleSeriesStyle(btn) {
  const container = btn.closest('.chart-container');
  const panel = container.querySelector('.series-style-panel');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;

  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    return;
  }

  const opt = chart.getOption();
  const series = opt.series || [];
  panel.innerHTML = '';

  const DECAL_OPTIONS = [
    { v: 'none', l: '无花纹' },
    { v: 'slash', l: '斜线 ////' },
    { v: 'backslash', l: '反斜线 \\\\' },
    { v: 'dot', l: '圆点' },
    { v: 'hline', l: '水平线 ──' },
    { v: 'diamond', l: '菱形' },
    { v: 'grid', l: '斜格' },
  ];
  function _decalFromName(name) {
    const map = {
      'none': null,
      'slash': BAR_DECALS[0],
      'backslash': BAR_DECALS[1],
      'dot': BAR_DECALS[2],
      'hline': BAR_DECALS[3],
      'diamond': BAR_DECALS[4],
      'grid': BAR_DECALS[5],
    };
    return map[name] || null;
  }
  function _decalToName(decal) {
    if (!decal) return 'none';
    if (decal.symbol === 'rect' && decal.rotation > 0) return decal.dashArrayY && decal.dashArrayY[1] === 3 ? 'slash' : 'grid';
    if (decal.symbol === 'rect' && decal.rotation < 0) return 'backslash';
    if (decal.symbol === 'rect' && !decal.rotation) return 'hline';
    if (decal.symbol === 'circle') return 'dot';
    if (decal.symbol === 'diamond') return 'diamond';
    return 'none';
  }

  series.forEach((s, i) => {
    if (!s.name) return;
    const isLine = (s.type === 'line');
    const isBar = (s.type === 'bar');
    if (!isLine && !isBar) return;

    const color = (s.itemStyle && s.itemStyle.color) || '#999';

    const item = document.createElement('div');
    item.className = 'series-style-item';
    item.innerHTML = `<span class="swatch" style="background:${typeof color === 'string' ? color : '#999'}"></span><span class="series-name-label" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</span>`;

    if (isLine) {
      const curSymbol = s.symbol || 'circle';
      const curDash = (s.lineStyle && s.lineStyle.type) || 'solid';

      // 标记形状选择
      const symSel = document.createElement('select');
      symSel.title = '标记形状';
      SYMBOL_OPTIONS.forEach(op => {
        const o = document.createElement('option');
        o.value = op.v; o.textContent = op.l;
        if (op.v === curSymbol) o.selected = true;
        symSel.appendChild(o);
      });
      symSel.addEventListener('change', () => {
        const upd = [];
        for (let j = 0; j < series.length; j++) upd.push(j === i ? { symbol: symSel.value, symbolSize: symSel.value === 'none' ? 0 : 6 } : {});
        chart.setOption({ series: upd }, false);
      });

      // 线型选择
      const dashSel = document.createElement('select');
      dashSel.title = '线型';
      const curDashStr = _dashToStr(curDash);
      DASH_OPTIONS.forEach(op => {
        const o = document.createElement('option');
        o.value = op.v; o.textContent = op.l;
        if (op.v === curDashStr) o.selected = true;
        dashSel.appendChild(o);
      });
      dashSel.addEventListener('change', () => {
        const upd = [];
        for (let j = 0; j < series.length; j++) upd.push(j === i ? { lineStyle: { type: _parseDash(dashSel.value) } } : {});
        chart.setOption({ series: upd }, false);
      });

      item.appendChild(symSel);
      item.appendChild(dashSel);
    } else if (isBar) {
      // 检查是否有逐柱子独立样式（data 数组中每个元素有 itemStyle）
      const dataArr = s.data || [];
      const hasPerBarStyle = dataArr.length > 0 && dataArr.length <= 30 && typeof dataArr[0] === 'object' && dataArr[0] !== null && dataArr[0].itemStyle;

      if (hasPerBarStyle) {
        // 每根柱子单独一行
        const xOpt = opt.xAxis;
        const xAxis = Array.isArray(xOpt) ? xOpt[s.xAxisIndex || 0] : xOpt;
        const xLabels = (xAxis && xAxis.data) || [];
        item.innerHTML += ` <span style="font-size:11px;color:var(--text2)">(${dataArr.length} 根柱子)</span>`;
        panel.appendChild(item);

        dataArr.forEach((dp, di) => {
          const barLabel = xLabels[di] || `#${di + 1}`;
          const barColor = (dp.itemStyle && dp.itemStyle.color) || '#999';
          const barDecal = (dp.itemStyle && dp.itemStyle.decal) || null;
          const barItem = document.createElement('div');
          barItem.className = 'series-style-item';
          barItem.style.paddingLeft = '24px';
          barItem.innerHTML = `<span class="swatch" style="background:${typeof barColor === 'string' ? barColor : '#999'}"></span><span class="series-name-label">${escapeHtml(barLabel)}</span>`;

          const barDecalSel = document.createElement('select');
          barDecalSel.title = '花纹样式';
          const curBarName = _decalToName(barDecal);
          DECAL_OPTIONS.forEach(op => {
            const o = document.createElement('option');
            o.value = op.v; o.textContent = op.l;
            if (op.v === curBarName) o.selected = true;
            barDecalSel.appendChild(o);
          });
          barDecalSel.addEventListener('change', () => {
            // 更新单根柱子的 decal
            const newData = [...dataArr];
            const newDp = Object.assign({}, newData[di]);
            newDp.itemStyle = Object.assign({}, newDp.itemStyle, { decal: _decalFromName(barDecalSel.value) });
            newData[di] = newDp;
            const upd = [];
            for (let j = 0; j < series.length; j++) upd.push(j === i ? { data: newData } : {});
            chart.setOption({ series: upd }, false);
          });
          barItem.appendChild(barDecalSel);
          panel.appendChild(barItem);
        });
      } else {
        // 整个 series 统一花纹
        const curDecal = (s.itemStyle && s.itemStyle.decal) || null;
        const decalSel = document.createElement('select');
        decalSel.title = '花纹样式';
        const curName = _decalToName(curDecal);
        DECAL_OPTIONS.forEach(op => {
          const o = document.createElement('option');
          o.value = op.v; o.textContent = op.l;
          if (op.v === curName) o.selected = true;
          decalSel.appendChild(o);
        });
        decalSel.addEventListener('change', () => {
          const upd = [];
          for (let j = 0; j < series.length; j++) upd.push(j === i ? { itemStyle: { decal: _decalFromName(decalSel.value) } } : {});
          chart.setOption({ series: upd }, false);
        });
        item.appendChild(decalSel);
        panel.appendChild(item);
      }
    }

    if (isLine) panel.appendChild(item);
  });

  if (panel.children.length === 0) {
    panel.innerHTML = '<span style="font-size:12px;color:#656d76;">当前图表没有可调整样式的系列</span>';
  }
  panel.classList.add('show');
}

function clearCharts() {
  chartInstances.forEach(c => c.dispose());
  chartInstances = [];
  const area = document.getElementById('chartArea');
  // 只移除图表容器，保留已保存画廊
  area.querySelectorAll('.chart-container').forEach(el => el.remove());
  if (!area.querySelector('.empty-state')) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.innerHTML = '<div class="icon" style="font-size:48px;opacity:0.3;">--</div><div>选择左侧的实验，再选择数据类别和指标，点击「生成图表」</div>';
    area.insertBefore(empty, area.firstChild);
  }
}
function _saveDefaultAxisNames(chart) {
  const opt = chart.getOption();
  if (!opt) return;
  const xNames = (opt.xAxis || []).map(ax => ax.name || '');
  const yNames = (opt.yAxis || []).map(ax => ax.name || '');
  chartDefaultAxisNames.set(chart, { x: xNames, y: yNames });
}
// ──────── 图表标题显示/隐藏 & 实时更新 ────────
function updateAllChartsTitleVisibility() {
  const show = document.getElementById('showChartTitle').checked;
  document.querySelectorAll('.chart-container .title-text').forEach(el => {
    el.style.display = show ? '' : 'none';
  });
}
function updateAllChartsTitleText() {
  const customTitle = document.getElementById('customTitleInput').value.trim();
  if (!customTitle) return; // 空时不覆盖，保留各自原有标题
  document.querySelectorAll('.chart-container .title-text').forEach(el => {
    el.textContent = customTitle;
  });
}
function updateAllChartsAxisNames() {
  const customX = document.getElementById('customXAxisName').value.trim();
  const customY = document.getElementById('customYAxisName').value.trim();
  const showX = document.getElementById('showXAxisName').checked;
  const showY = document.getElementById('showYAxisName').checked;
  chartInstances.forEach(chart => {
    const defaults = chartDefaultAxisNames.get(chart);
    if (!defaults) return;
    const opt = chart.getOption();
    if (!opt) return;
    if (opt.xAxis) {
      const updates = opt.xAxis.map((ax, i) => {
        const defaultName = defaults.x[i] || '';
        return { name: showX ? (customX || defaultName) : '' };
      });
      chart.setOption({ xAxis: updates }, false);
    }
    if (opt.yAxis) {
      const updates = opt.yAxis.map((ax, i) => {
        const defaultName = defaults.y[i] || '';
        return { name: showY ? (customY || defaultName) : '' };
      });
      chart.setOption({ yAxis: updates }, false);
    }
  });
}

// ──────── 配置对比 ────────
async function showConfigDiff() {
  const runs = Array.from(selectedRuns);
  if (runs.length < 2) {
    showToast('请选择至少 2 个实验进行配置对比', 'warn');
    return;
  }
  const res = await fetch(`/api/config_diff?runs=${encodeURIComponent(runs.join(','))}`);
  const data = await res.json();

  if (data.error) {
    showToast(data.error, 'error');
    return;
  }

  const body = document.getElementById('configModalBody');
  if (data.diffs.length === 0) {
    body.innerHTML = '<p style="color:var(--text2);">选中的实验配置完全相同。</p>';
  } else {
    const header = data.runs.map(r => `<th>${shortRunName(r)}</th>`).join('');
    const rows = data.diffs.map(d => {
      const cells = data.runs.map(r => {
        const v = d.values[r];
        if (v === null || v === undefined) return '<td class="diff-val-missing">N/A</td>';
        const formatted = typeof v === 'object' ? JSON.stringify(v) : String(v);
        return `<td class="diff-val-changed">${escapeHtml(formatted)}</td>`;
      }).join('');
      return `<tr><td style="color:var(--accent);font-family:monospace;">${escapeHtml(d.path)}</td>${cells}</tr>`;
    }).join('');
    body.innerHTML = `
      <table class="diff-table">
        <thead><tr><th>配置路径</th>${header}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  document.getElementById('configModal').classList.add('show');
}

function closeConfigModal() {
  document.getElementById('configModal').classList.remove('show');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ──────── 导出 PNG ────────
function _getChartFromBtn(btn) {
  const container = btn.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  return chartInstances.find(c => c.getDom() === chartDiv);
}

function _getChartTitle(btn) {
  const container = btn.closest('.chart-container');
  const span = container.querySelector('.chart-title > span');
  return span ? span.textContent.trim() : 'chart';
}

// ──────── 导出时临时隐藏 dataZoom 滑块 ────────
function _hideDataZoom(chart) {
  const opt = chart.getOption();
  const dz = opt.dataZoom;
  if (!dz || dz.length === 0) return null;
  const saved = dz.map((d, i) => ({ index: i, show: d.show }));
  chart.setOption({ dataZoom: dz.map((d, i) => d.type === 'slider' ? { id: d.id, show: false } : {}) }, false);
  return saved;
}
function _restoreDataZoom(chart, saved) {
  if (!saved) return;
  const restore = saved.map(s => ({ show: s.show !== false }));
  chart.setOption({ dataZoom: restore }, false);
}

function exportChartPng(btn) {
  const chart = _getChartFromBtn(btn);
  if (!chart) return;
  const saved = _hideDataZoom(chart);
  const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
  _restoreDataZoom(chart, saved);
  const a = document.createElement('a');
  a.href = url;
  a.download = _getChartTitle(btn).replace(/[\/\\:*?"<>|]/g, '_') + '.png';
  a.click();
}

// ──────── 导出黑白 PNG ────────
function exportChartBW(btn) {
  const chart = _getChartFromBtn(btn);
  if (!chart) return;
  const saved = _hideDataZoom(chart);
  const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
  _restoreDataZoom(chart, saved);
  const img = new Image();
  img.onload = function() {
    const cvs = document.createElement('canvas');
    cvs.width = img.width;
    cvs.height = img.height;
    const ctx = cvs.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, cvs.width, cvs.height);
    const d = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      d[i] = d[i+1] = d[i+2] = gray;
    }
    ctx.putImageData(imageData, 0, 0);
    const a = document.createElement('a');
    a.href = cvs.toDataURL('image/png');
    a.download = _getChartTitle(btn).replace(/[\/\\:*?"<>|]/g, '_') + '_bw.png';
    a.click();
  };
  img.src = url;
}

// ──────── 导出 PDF（直接生成，无打印对话框）────────
function exportChartPdf(btn) {
  const chart = _getChartFromBtn(btn);
  if (!chart) return;
  const title = _getChartTitle(btn).replace(/[\/\\:*?"<>|]/g, '_');
  const saved = _hideDataZoom(chart);
  const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
  _restoreDataZoom(chart, saved);
  const img = new Image();
  img.onload = function() {
    const imgW = img.width;
    const imgH = img.height;
    // 页面尺寸 = 图片尺寸（px → mm，按 72dpi），无留白
    const pxToMm = 25.4 / 72;
    const pageW = imgW * pxToMm;
    const pageH = imgH * pxToMm;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: pageW >= pageH ? 'landscape' : 'portrait', unit: 'mm', format: [pageW, pageH] });
    pdf.addImage(url, 'PNG', 0, 0, pageW, pageH);
    pdf.save(title + '.pdf');
  };
  img.src = url;
}

// ──────── 保存快照到后端文件系统 ────────
let _savedGalleryCache = [];  // 缓存 gallery 列表（只含 filename/title/thumbUrl/time）

async function _fetchSavedList() {
  try {
    const resp = await fetch('/api/saved_charts');
    if (!resp.ok) return [];
    return await resp.json();
  } catch { return []; }
}

async function _fetchSavedFull(filename) {
  const resp = await fetch(`/api/saved_charts/${encodeURIComponent(filename)}`);
  if (!resp.ok) return null;
  return await resp.json();
}

async function saveChartSnapshot(btn) {
  const chart = _getChartFromBtn(btn);
  if (!chart) return;
  const title = _getChartTitle(btn);
  const thumbUrl = chart.getDataURL({ type: 'png', pixelRatio: 0.5, backgroundColor: '#ffffff' });
  const option = chart.getOption();
  const container = btn.closest('.chart-container');
  const chartBox = container.querySelector('.chart-box');
  const boxH = chartBox.style.height || '';
  const boxW = chartBox.style.width || '';
  const savedAxisNames = {
    x: (option.xAxis || []).map(ax => ax.name || ''),
    y: (option.yAxis || []).map(ax => ax.name || '')
  };
  // 保存滑块状态
  const bwSlider = container.querySelector('.bar-width-slider');
  const bgSlider = container.querySelector('.bar-gap-slider');
  const barSliders = {
    barWidth: bwSlider ? bwSlider.value : null,
    barGap: bgSlider ? bgSlider.value : null
  };
  const payload = { title, thumbUrl, option, boxH, boxW, barSliders, defaults: savedAxisNames, time: new Date().toLocaleString('zh-CN') };
  btn.textContent = '保存中…';
  try {
    const resp = await fetch('/api/saved_charts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error('保存失败');
    btn.textContent = '已保存';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = '保存'; btn.classList.remove('saved'); }, 2000);
    await renderSavedGallery();
  } catch (e) {
    btn.textContent = '失败';
    showToast('保存失败: ' + e.message, 'error');
    setTimeout(() => { btn.textContent = '保存'; }, 2000);
  }
}

async function renderSavedGallery() {
  _savedGalleryCache = await _fetchSavedList();
  const saved = _savedGalleryCache;
  const section = document.getElementById('savedSection');
  const grid = document.getElementById('savedGrid');
  const countEl = document.getElementById('savedCount');
  countEl.textContent = saved.length;
  if (saved.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  grid.innerHTML = saved.map((item, idx) => `
    <div class="saved-card" onclick="restoreSaved(${idx})" title="点击恢复到编辑区">
      <img src="${item.thumbUrl || ''}" alt="${escapeHtml(item.title)}">
      <div class="saved-card-footer">
        <span class="saved-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
        <span class="saved-actions">
          <button class="btn btn-xs" onclick="event.stopPropagation(); downloadSaved(${idx})">下载</button>
          <button class="btn btn-xs btn-danger" onclick="event.stopPropagation(); removeSaved(${idx})">删除</button>
        </span>
      </div>
    </div>
  `).join('');
}

async function restoreSaved(idx) {
  const meta = _savedGalleryCache[idx];
  if (!meta) return;
  showToast('正在加载…', 'info');
  const item = await _fetchSavedFull(meta.filename);
  if (!item || !item.option) {
    showToast('加载失败或格式不兼容', 'error');
    return;
  }

  const chartArea = document.getElementById('chartArea');
  const empty = chartArea.querySelector('.empty-state');
  if (empty) empty.remove();

  const containerId = `chart_restored_${Date.now()}_${idx}`;
  const extraH = item.boxH ? parseInt(item.boxH) : null;
  const container = _buildChartContainer(containerId, item.title, extraH);
  chartArea.insertBefore(container, chartArea.firstChild);

  // 恢复宽度
  if (item.boxW) {
    const cbox = container.querySelector('.chart-box');
    if (cbox) cbox.style.width = item.boxW;
  }

  const chart = echarts.init(document.getElementById(containerId));
  chartInstances.push(chart);
  chart.setOption(item.option);
  _autoYAxisGap(chart);
  _makeChartResizable(container);

  // 恢复柱宽滑块
  const hasBars = (item.option.series || []).some(s => s.type === 'bar');
  if (hasBars) {
    _showBarWidthCtrl(container);
    const bs = item.barSliders || {};
    const firstBar = (item.option.series || []).find(s => s.type === 'bar') || {};
    // 优先用保存的滑块值，其次从 option.series 读取
    const bwVal = bs.barWidth || (firstBar.barWidth ? parseInt(firstBar.barWidth) : null);
    const bgVal = bs.barGap || (firstBar.barCategoryGap ? parseInt(firstBar.barCategoryGap) : null);
    if (bwVal) {
      const slider = container.querySelector('.bar-width-slider');
      const valEl = container.querySelector('.bar-width-val');
      if (slider && valEl) { slider.value = bwVal; valEl.textContent = bwVal + '%'; }
    }
    if (bgVal) {
      const slider = container.querySelector('.bar-gap-slider');
      const valEl = container.querySelector('.bar-gap-val');
      if (slider && valEl) { slider.value = bgVal; valEl.textContent = bgVal + '%'; }
    }
  }

  if (item.defaults) {
    chartDefaultAxisNames.set(chart, item.defaults);
  } else {
    _saveDefaultAxisNames(chart);
  }

  container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  showToast(`已恢复图表「${item.title}」到编辑区`, 'success');
}

async function downloadSaved(idx) {
  const meta = _savedGalleryCache[idx];
  if (!meta) return;
  const item = await _fetchSavedFull(meta.filename);
  if (!item) return;
  const fname = item.title.replace(/[\/\\:*?"<>|]/g, '_') + '.png';
  if (item.option) {
    const tmpDiv = document.createElement('div');
    tmpDiv.style.cssText = 'position:absolute;left:-9999px;width:1200px;height:800px;';
    document.body.appendChild(tmpDiv);
    const tmpChart = echarts.init(tmpDiv);
    tmpChart.setOption(item.option);
    const url = tmpChart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
    tmpChart.dispose();
    document.body.removeChild(tmpDiv);
    const a = document.createElement('a');
    a.href = url; a.download = fname; a.click();
  } else if (meta.thumbUrl) {
    const a = document.createElement('a');
    a.href = meta.thumbUrl; a.download = fname; a.click();
  }
}

async function removeSaved(idx) {
  const meta = _savedGalleryCache[idx];
  if (!meta) return;
  await fetch(`/api/saved_charts/${encodeURIComponent(meta.filename)}`, { method: 'DELETE' });
  await renderSavedGallery();
}

async function clearAllSaved() {
  if (!confirm('确定清空所有已保存的图表？')) return;
  const promises = _savedGalleryCache.map(m =>
    fetch(`/api/saved_charts/${encodeURIComponent(m.filename)}`, { method: 'DELETE' })
  );
  await Promise.all(promises);
  await renderSavedGallery();
}

function scrollToSaved() {
  const section = document.getElementById('savedSection');
  if (section) section.scrollIntoView({ behavior: 'smooth' });
}

// ──────── 迁移 localStorage 旧图到后端 ────────
async function _migrateLocalStorage() {
  const SAVED_KEY = 'mentalmarket_eval_saved_charts';
  const MIGRATED_KEY = 'mentalmarket_eval_migrated';
  if (localStorage.getItem(MIGRATED_KEY)) return; // 已迁移过
  let old;
  try { old = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); } catch { return; }
  if (!old.length) { localStorage.setItem(MIGRATED_KEY, '1'); return; }
  console.log(`迁移 ${old.length} 个 localStorage 图表到后端…`);
  let ok = 0;
  // 倒序导入使得最新的排在前面（后端按文件名倒序）
  for (const item of old.reverse()) {
    try {
      const resp = await fetch('/api/saved_charts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item),
      });
      if (resp.ok) ok++;
    } catch {}
  }
  localStorage.setItem(MIGRATED_KEY, '1');
  console.log(`迁移完成: ${ok}/${old.length}`);
  if (ok > 0) showToast(`已从浏览器缓存迁移 ${ok} 个图表到服务端`, 'success');
}

// 启动
init();
_migrateLocalStorage().then(() => renderSavedGallery());
</script>
