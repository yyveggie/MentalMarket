        : { type: 'value', name: _axisXName(data.x_label), nameLocation: 'center', nameGap: 25, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, minInterval: 1 },
      yAxis: { type: 'value', name: _axisYName(metricDisplay + yScaleSuffix), nameLocation: 'center', nameGap: 50, nameTextStyle: { color: '#1f2328', fontSize: 13, fontWeight: 'bold' }, axisLine: { lineStyle: { color: '#d0d7de' } }, axisLabel: { color: '#656d76' }, splitLine: { show: document.getElementById('gridLineToggle').checked, lineStyle: { color: '#eaeef2' } } },
      dataZoom: cat.x_type === 'category' ? [] : [
        { type: 'inside', xAxisIndex: 0 },
        { type: 'slider', xAxisIndex: 0, height: 20, bottom: 5, borderColor: '#d0d7de', backgroundColor: '#ffffff', fillerColor: 'rgba(9,105,218,0.1)', handleStyle: { color: '#0969da' }, textStyle: { color: '#656d76' } }
      ],
      series: seriesList,
    };

    // 基准线：当 toggle 开启时，在第一个 series 上添加 y=0 基准线
    const showBaseline = document.getElementById('baselineToggle').checked;
    if (showBaseline && seriesList.length > 0) {
      const baseSeries = seriesList[0];
      if (!baseSeries.markLine) baseSeries.markLine = { data: [] };
      baseSeries.markLine.silent = true;
      baseSeries.markLine.symbol = 'none';
      baseSeries.markLine.lineStyle = { type: 'dashed', color: '#cf222e', width: 1.5 };
      baseSeries.markLine.data.push({
        yAxis: 0,
        label: { formatter: 'y = 0', fontSize: 10, color: '#cf222e', position: 'insideEndTop' }
      });
    }

    chart.setOption(option);
    _autoYAxisGap(chart);
    _saveDefaultAxisNames(chart);
    _makeChartResizable(container);
    if (seriesList.some(s => s.type === 'bar')) _showBarWidthCtrl(container);
  }
}


function getRunDisplayName(name) {
  if (runAliases[name]) return runAliases[name];
  return shortRunName(name);
}

function shortRunName(name) {
  return name;
}

function removeChart(btn) {
  const container = btn.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const idx = chartInstances.findIndex(c => c.getDom() === chartDiv);
  if (idx >= 0) {
    chartInstances[idx].dispose();
    chartInstances.splice(idx, 1);
  }
  container.remove();
}

function adjustBarWidth(slider) {
  const container = slider.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;
  const px = Number(slider.value);
  slider.nextElementSibling.textContent = px + 'px';
  const opt = chart.getOption();
  (opt.series || []).forEach(s => {
    if (s.type === 'bar') {
      s.barWidth = px;
      s.barMaxWidth = undefined;
    }
  });
  chart.setOption(opt, true);
}

function adjustBarCatWidth(slider) {
  const container = slider.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;
  const pct = Number(slider.value);
  slider.nextElementSibling.textContent = pct + '%';
  /* pct=100 显示全部类目(默认); pct=50 只显示一半类目→每个类目更宽 */
  if (pct >= 100) {
    chart.setOption({ dataZoom: [] }, true);
    return;
  }
  const dzInside = { type: 'inside', xAxisIndex: 0, start: 0, end: pct, zoomLock: true };
  const dzSlider = { type: 'slider', xAxisIndex: 0, start: 0, end: pct, bottom: 0, height: 18 };
  chart.setOption({ dataZoom: [dzInside, dzSlider] });
}

function adjustBarPadding(slider) {
  const container = slider.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;
  const pct = slider.value + '%';
  slider.nextElementSibling.textContent = pct;
  const opt = chart.getOption();
  (opt.series || []).forEach(s => {
    if (s.type === 'bar') s.barCategoryGap = pct;
  });
  chart.setOption(opt, true);
}

function _makeChartResizable(container) {
  const chartDiv = container.querySelector('.chart-box') || container;
  if (chartDiv && !chartDiv.classList.contains('resizable')) {
    chartDiv.classList.add('resizable');
    const ro = new ResizeObserver(() => {
      const chart = chartInstances.find(c => c.getDom() === chartDiv);
      if (chart) {
        chart.resize();
        _autoYAxisGap(chart);
      }
    });
    ro.observe(chartDiv);
  }
}

function _showBarWidthCtrl(container) {
  const ctrl = container.querySelector('.bar-width-ctrl');
  if (ctrl) ctrl.style.display = '';
  _makeChartResizable(container);
}

function applyChartWidth(pct) {
  pct = Math.max(20, Math.min(100, parseInt(pct) || 100));
  document.getElementById('chartWidthPct').value = pct;
  document.querySelectorAll('.chart-box').forEach(box => {
    box.style.width = pct + '%';
  });
  chartInstances.forEach(c => c.resize());
}

function editChartTitle(span) {
  const oldText = span.textContent;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'title-edit';
  input.value = oldText;
  span.replaceWith(input);
  input.focus();
  input.select();
  const finish = () => {
    const newText = input.value.trim() || oldText;
    const newSpan = document.createElement('span');
    newSpan.className = 'title-text';
    newSpan.textContent = newText;
    newSpan.title = '点击编辑标题';
    newSpan.onclick = () => editChartTitle(newSpan);
    input.replaceWith(newSpan);
  };
  input.addEventListener('blur', finish);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
    if (e.key === 'Escape') { input.value = oldText; input.blur(); }
  });
}

// ──────── 曲线样式自定义面板 ────────
const SYMBOL_OPTIONS = [
  {v:'circle',l:'●圆'},  {v:'rect',l:'■方'},  {v:'triangle',l:'▲三角'},
  {v:'diamond',l:'◆菱形'}, {v:'pin',l:'📍钉'},  {v:'arrow',l:'➤箭头'},
  {v:'roundRect',l:'▢圆方'}, {v:'emptyCircle',l:'○空圆'}, {v:'emptyRect',l:'□空方'},
  {v:'emptyTriangle',l:'△空三角'}, {v:'emptyDiamond',l:'◇空菱'}, {v:'none',l:'无'},
];
const DASH_OPTIONS = [
  {v:'solid',l:'实线'}, {v:'dashed',l:'虚线'}, {v:'dotted',l:'点线'},
  {v:'10,4',l:'长虚线'}, {v:'8,3,2,3',l:'点划线'}, {v:'4,2',l:'短虚线'}, {v:'12,4,4,4',l:'长点划'},
];
function _parseDash(v) {
  if (v === 'solid' || v === 'dashed' || v === 'dotted') return v;
  return v.split(',').map(Number);
}
function _dashToStr(d) {
  if (typeof d === 'string') return d;
  if (Array.isArray(d)) return d.join(',');
  return 'solid';
}

function toggleLegend(btn) {
  const container = btn.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;
  const opt = chart.getOption();
  const legend = opt.legend && opt.legend[0];
  const isShown = legend ? legend.show !== false : true;
  chart.setOption({ legend: { show: !isShown } }, false);
  btn.style.opacity = isShown ? '0.5' : '1';
}

function toggleSeriesStyle(btn) {
  const container = btn.closest('.chart-container');
  const panel = container.querySelector('.series-style-panel');
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;

  if (panel.classList.contains('show')) {
    panel.classList.remove('show');
    return;
  }

  const opt = chart.getOption();
  const series = opt.series || [];
  panel.innerHTML = '';

  const DECAL_OPTIONS = [
    { v: 'none', l: '无花纹' },
    { v: 'slash', l: '斜线 ////' },
    { v: 'backslash', l: '反斜线 \\\\' },
    { v: 'dot', l: '圆点' },
    { v: 'hline', l: '水平线 ──' },
    { v: 'diamond', l: '菱形' },
    { v: 'grid', l: '斜格' },
  ];
  function _decalFromName(name) {
    const map = {
      'none': null,
      'slash': BAR_DECALS[0],
      'backslash': BAR_DECALS[1],
      'dot': BAR_DECALS[2],
      'hline': BAR_DECALS[3],
      'diamond': BAR_DECALS[4],
      'grid': BAR_DECALS[5],
    };
    return map[name] || null;
  }
  function _decalToName(decal) {
    if (!decal) return 'none';
    if (decal.symbol === 'rect' && decal.rotation > 0) return decal.dashArrayY && decal.dashArrayY[1] === 3 ? 'slash' : 'grid';
    if (decal.symbol === 'rect' && decal.rotation < 0) return 'backslash';
    if (decal.symbol === 'rect' && !decal.rotation) return 'hline';
    if (decal.symbol === 'circle') return 'dot';
    if (decal.symbol === 'diamond') return 'diamond';
    return 'none';
  }

  // ── 全局统一控制行 ──
  const lineIndices = [];
  series.forEach((s, idx) => { if (s.name && s.type === 'line') lineIndices.push(idx); });
  if (lineIndices.length > 1) {
    const globalRow = document.createElement('div');
    globalRow.className = 'series-style-item';
    globalRow.style.cssText = 'width:100%;padding-bottom:6px;margin-bottom:4px;border-bottom:1px solid var(--border);';
    globalRow.innerHTML = '<span style="font-weight:600;font-size:12px;color:var(--text2);">统一设置全部曲线</span>';

    const gSymSel = document.createElement('select');
    gSymSel.title = '统一标记形状';
    gSymSel.innerHTML = '<option value="" selected>形状…</option>';
    SYMBOL_OPTIONS.forEach(op => { const o = document.createElement('option'); o.value = op.v; o.textContent = op.l; gSymSel.appendChild(o); });
    gSymSel.addEventListener('change', () => {
      if (!gSymSel.value) return;
      const upd = series.map((_, j) => lineIndices.includes(j) ? { symbol: gSymSel.value, symbolSize: gSymSel.value === 'none' ? 0 : 6 } : {});
      chart.setOption({ series: upd }, false);
      gSymSel.selectedIndex = 0;
    });

    const gIntInput = document.createElement('input');
    gIntInput.type = 'number'; gIntInput.min = 0; gIntInput.max = 100; gIntInput.step = 1;
    gIntInput.placeholder = '间隔…';
    gIntInput.title = '统一标记间隔（0=每点，空=自动）';
    gIntInput.style.cssText = 'width:52px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:11px;padding:1px 4px;';
    gIntInput.addEventListener('change', () => {
      const v = gIntInput.value.trim();
      const szVal = gSzInput.value.trim();
      const sz = (szVal !== '' && !isNaN(Number(szVal))) ? Math.max(1, Math.round(Number(szVal))) : 6;
      const upd = series.map((_, j) => {
        if (!lineIndices.includes(j)) return {};
        if (v === '' || isNaN(Number(v))) return { symbolSize: sz, showAllSymbol: 'auto' };
        const n = Math.max(0, Math.round(Number(v)));
        if (n === 0) return { symbolSize: sz, showAllSymbol: true };
        return { symbolSize: function(_val, params) { return params.dataIndex % n === 0 ? sz : 0; }, showAllSymbol: true };
      });
      chart.setOption({ series: upd }, false);
    });

    const gSzInput = document.createElement('input');
    gSzInput.type = 'number'; gSzInput.min = 1; gSzInput.max = 30; gSzInput.step = 1;
    gSzInput.placeholder = '大小…';
    gSzInput.title = '统一标记大小';
    gSzInput.style.cssText = 'width:48px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:11px;padding:1px 4px;';
    gSzInput.addEventListener('change', () => {
      const v = gSzInput.value.trim();
      if (v === '' || isNaN(Number(v))) return;
      const sz = Math.max(1, Math.round(Number(v)));
      const intVal = gIntInput.value.trim();
      const upd = series.map((_, j) => {
        if (!lineIndices.includes(j)) return {};
        if (intVal === '' || isNaN(Number(intVal))) return { symbolSize: sz, showAllSymbol: true };
        const n = Math.max(0, Math.round(Number(intVal)));
        if (n === 0) return { symbolSize: sz, showAllSymbol: true };
        return { symbolSize: function(_val, params) { return params.dataIndex % n === 0 ? sz : 0; }, showAllSymbol: true };
      });
      chart.setOption({ series: upd }, false);
    });

    const gDashSel = document.createElement('select');
    gDashSel.title = '统一线型';
    gDashSel.innerHTML = '<option value="" selected>线型…</option>';
    DASH_OPTIONS.forEach(op => { const o = document.createElement('option'); o.value = op.v; o.textContent = op.l; gDashSel.appendChild(o); });
    gDashSel.addEventListener('change', () => {
      if (!gDashSel.value) return;
      const upd = series.map((_, j) => lineIndices.includes(j) ? { lineStyle: { type: _parseDash(gDashSel.value) } } : {});
      chart.setOption({ series: upd }, false);
      gDashSel.selectedIndex = 0;
    });

    globalRow.appendChild(gSymSel);
    globalRow.appendChild(gSzInput);
    globalRow.appendChild(gIntInput);
    globalRow.appendChild(gDashSel);
    panel.appendChild(globalRow);
  }

  series.forEach((s, i) => {
    if (!s.name) return;
    const isLine = (s.type === 'line');
    const isBar = (s.type === 'bar');
    if (!isLine && !isBar) return;

    const color = (s.itemStyle && s.itemStyle.color) || '#999';

    const item = document.createElement('div');
    item.className = 'series-style-item';
    item.innerHTML = `<span class="swatch" style="background:${typeof color === 'string' ? color : '#999'}"></span>`;
    // 可编辑的系列名
    const nameInput = document.createElement('input');
    nameInput.type = 'text';
    nameInput.value = s.name;
    nameInput.title = '修改名称后回车确认';
    nameInput.style.cssText = 'background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:12px;padding:2px 6px;min-width:200px;flex:1;';
    const applyRename = () => {
      const newName = nameInput.value.trim();
      if (!newName || newName === s.name) return;
      const oldName = s.name;
      const seriesUpdate = [];
      for (let j = 0; j < series.length; j++) seriesUpdate.push(j === i ? { name: newName } : {});
      const curOpt = chart.getOption();
      const legendUpdate = {};
      if (curOpt.legend && curOpt.legend[0] && curOpt.legend[0].data) {
        const legData = curOpt.legend[0].data.slice();
        const li = legData.indexOf(oldName);
        if (li >= 0) legData[li] = newName;
        legendUpdate.data = legData;
      }
      chart.setOption({ series: seriesUpdate, legend: [Object.keys(legendUpdate).length ? legendUpdate : {}] }, false);
      s.name = newName;
    };
    nameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); applyRename(); nameInput.blur(); } });
    nameInput.addEventListener('blur', applyRename);
    item.appendChild(nameInput);

    if (isLine) {
      const curSymbol = s.symbol || 'circle';
      const curDash = (s.lineStyle && s.lineStyle.type) || 'solid';

      // 标记形状选择
      const symSel = document.createElement('select');
      symSel.title = '标记形状';
      SYMBOL_OPTIONS.forEach(op => {
        const o = document.createElement('option');
        o.value = op.v; o.textContent = op.l;
        if (op.v === curSymbol) o.selected = true;
        symSel.appendChild(o);
      });
      symSel.addEventListener('change', () => {
        const upd = [];
        for (let j = 0; j < series.length; j++) upd.push(j === i ? { symbol: symSel.value, symbolSize: symSel.value === 'none' ? 0 : 6 } : {});
        chart.setOption({ series: upd }, false);
      });

      // 标记间隔
      const intInput = document.createElement('input');
      intInput.type = 'number';
      intInput.min = 0;
      intInput.max = 100;
      intInput.step = 1;
      intInput.placeholder = 'auto';
      intInput.title = '标记间隔（0=每点显示，空=自动）';
      intInput.style.cssText = 'width:48px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:11px;padding:1px 4px;';
      intInput.addEventListener('change', () => {
        const v = intInput.value.trim();
        const curSz = Math.max(1, Math.round(Number(szInput.value) || 6));
        const upd = [];
        for (let j = 0; j < series.length; j++) {
          if (j === i) {
            if (v === '' || isNaN(Number(v))) {
              upd.push({ symbolSize: curSz, showAllSymbol: 'auto' });
            } else {
              const n = Math.max(0, Math.round(Number(v)));
              if (n === 0) {
                upd.push({ symbolSize: curSz, showAllSymbol: true });
              } else {
                upd.push({ symbolSize: function(_val, params) { return params.dataIndex % n === 0 ? curSz : 0; }, showAllSymbol: true });
              }
            }
          } else {
            upd.push({});
          }
        }
        chart.setOption({ series: upd }, false);
      });

      // 线型选择
      const dashSel = document.createElement('select');
      dashSel.title = '线型';
      const curDashStr = _dashToStr(curDash);
      DASH_OPTIONS.forEach(op => {
        const o = document.createElement('option');
        o.value = op.v; o.textContent = op.l;
        if (op.v === curDashStr) o.selected = true;
        dashSel.appendChild(o);
      });
      dashSel.addEventListener('change', () => {
        const upd = [];
        for (let j = 0; j < series.length; j++) upd.push(j === i ? { lineStyle: { type: _parseDash(dashSel.value) } } : {});
        chart.setOption({ series: upd }, false);
      });

      // 标记大小
      const szInput = document.createElement('input');
      szInput.type = 'number'; szInput.min = 1; szInput.max = 30; szInput.step = 1;
      szInput.value = typeof s.symbolSize === 'number' ? s.symbolSize : 6;
      szInput.title = '标记大小';
      szInput.style.cssText = 'width:40px;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:11px;padding:1px 4px;';
      szInput.addEventListener('change', () => {
        const sz = Math.max(1, Math.round(Number(szInput.value) || 6));
        const intVal = intInput.value.trim();
        const upd = [];
        for (let j = 0; j < series.length; j++) {
          if (j === i) {
            if (intVal === '' || isNaN(Number(intVal))) {
              upd.push({ symbolSize: sz, showAllSymbol: true });
            } else {
              const n = Math.max(0, Math.round(Number(intVal)));
              if (n === 0) {
                upd.push({ symbolSize: sz, showAllSymbol: true });
              } else {
                upd.push({ symbolSize: function(_val, params) { return params.dataIndex % n === 0 ? sz : 0; }, showAllSymbol: true });
              }
            }
          } else {
            upd.push({});
          }
        }
        chart.setOption({ series: upd }, false);
      });

      item.appendChild(symSel);
      item.appendChild(szInput);
      item.appendChild(intInput);
      item.appendChild(dashSel);
    } else if (isBar) {
      // 检查是否有逐柱子独立样式（data 数组中每个元素有 itemStyle）
      const dataArr = s.data || [];
      const hasPerBarStyle = dataArr.length > 0 && dataArr.length <= 30 && typeof dataArr[0] === 'object' && dataArr[0] !== null && dataArr[0].itemStyle;

      if (hasPerBarStyle) {
        // 每根柱子单独一行
        const xOpt = opt.xAxis;
        const xAxis = Array.isArray(xOpt) ? xOpt[s.xAxisIndex || 0] : xOpt;
        const xLabels = (xAxis && xAxis.data) || [];
        const countSpan = document.createElement('span');
        countSpan.style.cssText = 'font-size:11px;color:var(--text2)';
        countSpan.textContent = `(${dataArr.length} 根柱子)`;
        item.appendChild(countSpan);
        panel.appendChild(item);

        dataArr.forEach((dp, di) => {
          const barLabel = xLabels[di] || `#${di + 1}`;
          const barColor = (dp.itemStyle && dp.itemStyle.color) || '#999';
          const barDecal = (dp.itemStyle && dp.itemStyle.decal) || null;
          const barItem = document.createElement('div');
          barItem.className = 'series-style-item';
          barItem.style.paddingLeft = '24px';
          barItem.innerHTML = `<span class="swatch" style="background:${typeof barColor === 'string' ? barColor : '#999'}"></span><span class="series-name-label">${escapeHtml(barLabel)}</span>`;

          const barDecalSel = document.createElement('select');
          barDecalSel.title = '花纹样式';
          const curBarName = _decalToName(barDecal);
          DECAL_OPTIONS.forEach(op => {
            const o = document.createElement('option');
            o.value = op.v; o.textContent = op.l;
            if (op.v === curBarName) o.selected = true;
            barDecalSel.appendChild(o);
          });
          barDecalSel.addEventListener('change', () => {
            // 更新单根柱子的 decal
            const newData = [...dataArr];
            const newDp = Object.assign({}, newData[di]);
            newDp.itemStyle = Object.assign({}, newDp.itemStyle, { decal: _decalFromName(barDecalSel.value) });
            newData[di] = newDp;
            const upd = [];
            for (let j = 0; j < series.length; j++) upd.push(j === i ? { data: newData } : {});
            chart.setOption({ series: upd }, false);
          });
          barItem.appendChild(barDecalSel);
          panel.appendChild(barItem);
        });
      } else {
        // 整个 series 统一花纹
        const curDecal = (s.itemStyle && s.itemStyle.decal) || null;
        const decalSel = document.createElement('select');
        decalSel.title = '花纹样式';
        const curName = _decalToName(curDecal);
        DECAL_OPTIONS.forEach(op => {
          const o = document.createElement('option');
          o.value = op.v; o.textContent = op.l;
          if (op.v === curName) o.selected = true;
          decalSel.appendChild(o);
        });
        decalSel.addEventListener('change', () => {
          const upd = [];
          for (let j = 0; j < series.length; j++) upd.push(j === i ? { itemStyle: { decal: _decalFromName(decalSel.value) } } : {});
          chart.setOption({ series: upd }, false);
        });
        item.appendChild(decalSel);
        panel.appendChild(item);
      }
    }

    // ── 删除系列按钮 ──
    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.title = '删除此系列';
    delBtn.style.cssText = 'cursor:pointer;border:1px solid var(--border);background:var(--bg);border-radius:3px;padding:0 4px;font-size:10px;line-height:1.4;color:#cf222e;margin-left:2px;';
    delBtn.addEventListener('click', () => {
      const curOpt = chart.getOption();
      const newSeries = curOpt.series.filter((_, j) => j !== i);
      const legendData = curOpt.legend && curOpt.legend[0] && curOpt.legend[0].data;
      const newLegend = legendData ? legendData.filter(n => n !== s.name) : undefined;
      chart.setOption({ series: newSeries, legend: newLegend ? [{ data: newLegend }] : undefined }, { replaceMerge: ['series'] });
      // 重建面板
      panel.classList.remove('show');
      setTimeout(() => {
        const fakeBtn = { closest(sel) { return sel === '.chart-container' ? container : null; } };
        toggleSeriesStyle(fakeBtn);
      }, 50);
    });
    item.appendChild(delBtn);

    // ── 曲线顺序调整按钮 ──
    const orderWrap = document.createElement('span');
    orderWrap.style.cssText = 'display:inline-flex;flex-direction:column;gap:0px;margin-left:4px;vertical-align:middle;';
    const btnUp = document.createElement('button');
    btnUp.textContent = '▲';
    btnUp.title = '上移（渲染在更底层）';
    btnUp.style.cssText = 'cursor:pointer;border:1px solid var(--border);background:var(--bg);border-radius:3px 3px 0 0;padding:0 4px;font-size:8px;line-height:1.1;color:var(--text2);';
    btnUp.addEventListener('click', () => { _swapSeriesAndRefresh(chart, container, i, i - 1); });
    const btnDown = document.createElement('button');
    btnDown.textContent = '▼';
    btnDown.title = '下移（渲染在更顶层）';
    btnDown.style.cssText = 'cursor:pointer;border:1px solid var(--border);border-top:none;background:var(--bg);border-radius:0 0 3px 3px;padding:0 4px;font-size:8px;line-height:1.1;color:var(--text2);';
    btnDown.addEventListener('click', () => { _swapSeriesAndRefresh(chart, container, i, i + 1); });
    if (i === 0) btnUp.disabled = true, btnUp.style.opacity = '0.3';
    if (i === series.length - 1) btnDown.disabled = true, btnDown.style.opacity = '0.3';
    orderWrap.appendChild(btnUp);
    orderWrap.appendChild(btnDown);
    item.appendChild(orderWrap);

    if (isLine) panel.appendChild(item);
  });

  if (panel.children.length === 0) {
    panel.innerHTML = '<span style="font-size:12px;color:#656d76;">当前图表没有可调整样式的系列</span>';
  }

  // ── x 轴标签改名 / 排序（仅 category 轴） ──
  const xAxisOpt = (opt.xAxis && opt.xAxis[0]) || {};
  if (xAxisOpt.type === 'category' && Array.isArray(xAxisOpt.data) && xAxisOpt.data.length > 0) {
    const divider = document.createElement('div');
    divider.style.cssText = 'width:100%;border-top:1px solid var(--border);margin:6px 0;font-size:11px;color:var(--text2);padding-top:4px;';
    divider.textContent = '横轴标签 (可改名 / ◀▶ 移动顺序):';
    panel.appendChild(divider);
    const labelContainer = document.createElement('div');
    labelContainer.style.cssText = 'display:flex;flex-direction:column;gap:3px;';
    panel.appendChild(labelContainer);

    function _rebuildLabelRows() {
      labelContainer.innerHTML = '';
      const curOpt = chart.getOption();
      const curLabels = curOpt.xAxis[0].data.slice();
      curLabels.forEach((_lbl, idx) => {
        const lItem = document.createElement('div');
        lItem.style.cssText = 'display:flex;align-items:center;gap:4px;font-size:12px;width:100%;';
        const btnL = document.createElement('button');
        btnL.textContent = '◀'; btnL.title = '左移'; btnL.disabled = idx === 0;
        btnL.style.cssText = 'cursor:pointer;border:1px solid var(--border);background:var(--bg2);border-radius:3px;padding:1px 5px;font-size:12px;flex-shrink:0;' + (idx === 0 ? 'opacity:.3;' : '');
        btnL.onclick = () => _swapBars(idx, idx - 1);
        const btnR = document.createElement('button');
        btnR.textContent = '▶'; btnR.title = '右移'; btnR.disabled = idx === curLabels.length - 1;
        btnR.style.cssText = 'cursor:pointer;border:1px solid var(--border);background:var(--bg2);border-radius:3px;padding:1px 5px;font-size:12px;flex-shrink:0;' + (idx === curLabels.length - 1 ? 'opacity:.3;' : '');
        btnR.onclick = () => _swapBars(idx, idx + 1);
        const lInp = document.createElement('input');
        lInp.type = 'text';
        lInp.value = typeof _lbl === 'string' ? _lbl.replace(/\n/g, ' ') : String(_lbl);
        lInp.title = '修改后回车确认';
        lInp.style.cssText = 'background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:4px;font-size:12px;padding:2px 6px;flex:1;min-width:200px;';
        const applyLabel = () => {
          const newLabel = lInp.value.trim();
          if (!newLabel) return;
          const co = chart.getOption();
          const cd = co.xAxis[0].data.slice();
          cd[idx] = newLabel;
          chart.setOption({ xAxis: [{ data: cd }] }, false);
        };
        lInp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); applyLabel(); lInp.blur(); } });
        lInp.addEventListener('blur', applyLabel);
        lItem.appendChild(btnL); lItem.appendChild(lInp); lItem.appendChild(btnR);
        // 删除此标签及对应数据
        const delLblBtn = document.createElement('button');
        delLblBtn.textContent = '✕';
        delLblBtn.title = '删除此标签及对应数据';
        delLblBtn.style.cssText = 'cursor:pointer;border:1px solid var(--border);background:var(--bg);border-radius:3px;padding:0 4px;font-size:10px;line-height:1.4;color:#cf222e;';
        delLblBtn.addEventListener('click', () => _removeCategory(idx));
        lItem.appendChild(delLblBtn);
        labelContainer.appendChild(lItem);
      });
    }
    function _swapBars(ii, jj) {
      const co = chart.getOption();
      const labels = co.xAxis[0].data.slice();
      [labels[ii], labels[jj]] = [labels[jj], labels[ii]];
      const seriesUpd = co.series.map(ss => {
        const d = (ss.data || []).slice();
        if (d.length > Math.max(ii, jj)) { [d[ii], d[jj]] = [d[jj], d[ii]]; }
        return { data: d };
      });
      chart.setOption({ xAxis: [{ data: labels }], series: seriesUpd }, false);
      _rebuildLabelRows();
    }
    function _removeCategory(idx) {
      const co = chart.getOption();
      const labels = co.xAxis[0].data.slice();
      labels.splice(idx, 1);
      const seriesUpd = co.series.map(ss => {
        const d = (ss.data || []).slice();
        d.splice(idx, 1);
        return { data: d };
      });
      chart.setOption({ xAxis: [{ data: labels }], series: seriesUpd }, false);
      _rebuildLabelRows();
    }
    _rebuildLabelRows();
  }

  panel.classList.add('show');
}

function _swapSeriesAndRefresh(chart, container, idxA, idxB) {
  const opt = chart.getOption();
  const seriesArr = opt.series;
  if (!seriesArr || idxA < 0 || idxB < 0 || idxA >= seriesArr.length || idxB >= seriesArr.length) return;
  [seriesArr[idxA], seriesArr[idxB]] = [seriesArr[idxB], seriesArr[idxA]];
  const legendData = opt.legend && opt.legend[0] && opt.legend[0].data;
  if (legendData && legendData.length > Math.max(idxA, idxB)) {
    [legendData[idxA], legendData[idxB]] = [legendData[idxB], legendData[idxA]];
  }
  chart.setOption({ series: seriesArr, legend: opt.legend }, { replaceMerge: ['series'] });
  // 重建样式面板
  const panel = container.querySelector('.series-style-panel');
  if (panel && panel.classList.contains('show')) {
    panel.classList.remove('show');
    setTimeout(() => {
      const fakeBtn = { closest(sel) { return sel === '.chart-container' ? container : null; } };
      toggleSeriesStyle(fakeBtn);
    }, 50);
  }
}

}
function _saveDefaultAxisNames(chart) {
  const opt = chart.getOption();
  if (!opt) return;
  const xNames = (opt.xAxis || []).map(ax => ax.name || '');
  const yNames = (opt.yAxis || []).map(ax => ax.name || '');
  chartDefaultAxisNames.set(chart, { x: xNames, y: yNames });
}

    el.style.display = show ? '' : 'none';

}
function updateAllChartsTitleText() {

  document.querySelectorAll('.chart-container .title-text').forEach(el => {

function updateAllChartsAxisNames() {
  const customX = document.getElementById('customXAxisName').value.trim();
  const customY = document.getElementById('customYAxisName').value.trim();
  const showX = document.getElementById('showXAxisName').checked;
  const showY = document.getElementById('showYAxisName').checked;
  chartInstances.forEach(chart => {
    const defaults = chartDefaultAxisNames.get(chart);
    if (!defaults) return;
    const opt = chart.getOption();
    if (!opt) return;
    if (opt.xAxis) {
      const updates = opt.xAxis.map((ax, i) => {
        const defaultName = defaults.x[i] || '';
        return { name: showX ? (customX || defaultName) : '' };
      });
      chart.setOption({ xAxis: updates }, false);
    }
    if (opt.yAxis) {
      const updates = opt.yAxis.map((ax, i) => {
        const defaultName = defaults.y[i] || '';
        return { name: showY ? (customY || defaultName) : '' };
      });
      chart.setOption({ yAxis: updates }, false);
    }
  });
}

async function showConfigDiff() {

    showToast('请选择至少 2 个实验进行配置对比', 'warn');
    return;
  }

  const data = await res.json();

  if (data.error) {
    showToast(data.error, 'error');
    return;
  }

  const body = document.getElementById('configModalBody');
  if (data.diffs.length === 0) {
    body.innerHTML = '<p style="color:var(--text2);">选中的实验配置完全相同。</p>';
  } else {
    const header = data.runs.map(r => `<th>${shortRunName(r)}</th>`).join('');
    const rows = data.diffs.map(d => {
      const cells = data.runs.map(r => {
        const v = d.values[r];
        if (v === null || v === undefined) return '<td class="diff-val-missing">N/A</td>';
        const formatted = typeof v === 'object' ? JSON.stringify(v) : String(v);
        return `<td class="diff-val-changed">${escapeHtml(formatted)}</td>`;
      }).join('');
      return `<tr><td style="color:var(--accent);font-family:monospace;">${escapeHtml(d.path)}</td>${cells}</tr>`;
    }).join('');
    body.innerHTML = `
      <table class="diff-table">
        <thead><tr><th>配置路径</th>${header}</tr></thead>
        <tbody>${rows}</tbody>
      </table>
    `;
  }

  document.getElementById('configModal').classList.add('show');
}

function closeConfigModal() {
  document.getElementById('configModal').classList.remove('show');

  const div = document.createElement('div');

// ──────── 市场效率排名 ────────
async function showEfficiencyRanking() {
  const chartArea = document.getElementById('chartArea');
  const loadingId = `rank_loading_${Date.now()}`;
  const loadingEl = document.createElement('div');
  loadingEl.id = loadingId;
  loadingEl.className = 'chart-container';
  loadingEl.innerHTML = `<div style="padding:24px; text-align:center; color:var(--text-secondary);">⏳ 正在计算所有实验的效率排名（可能需要 10-30 秒）...</div>`;
  chartArea.insertBefore(loadingEl, chartArea.firstChild);

  try {
    const res = await fetch('/api/efficiency_ranking');
    const data = await res.json();
    loadingEl.remove();

    if (data.error) {
      showToast(data.error, 'error');
      return;
    }

    const rows = data.ranking;
    if (!rows || rows.length === 0) {
      showToast('无可用实验数据', 'warn');
      return;
    }

    function fmt(v, d) { return v != null ? Number(v).toFixed(d || 3) : '—'; }
    function pStars(p) {
      if (p == null) return '';
      if (p < 0.001) return ' ***';
      if (p < 0.01) return ' **';
      if (p < 0.05) return ' *';
      if (p < 0.10) return ' †';
      return '';
    }

    // 计算排名颜色（梯度：绿→黄→红）
    const maxScore = Math.max(...rows.map(r => r.score));
    function scoreColor(s) {
      const ratio = Math.min(s / (maxScore || 1), 1);
      const r = Math.round(ratio * 220);
      const g = Math.round((1 - ratio) * 180);
      return `rgb(${r},${g},50)`;
    }

    let html = `<div style="padding:16px; font-family:monospace; overflow-x:auto;">`;
    html += `<h3 style="margin-bottom:12px;">🏆 市场效率排名（${rows.length} 个实验）</h3>`;
    html += `<p style="font-size:11px; color:#999; margin-bottom:8px;">Score = |CAAR| + 0.5×CI宽度 + 漂移幅度（越小=越有效）</p>`;

    html += `<table style="border-collapse:collapse; font-size:11px; width:100%;">`;
    html += `<tr style="background:#f0f0f0;">
      <th style="padding:4px 6px; border:1px solid #ddd;">#</th>
      <th style="padding:4px 6px; border:1px solid #ddd; text-align:left;">实验</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">n</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">Score</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">|CAAR|%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">CAR_std%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">CI宽%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">漂移%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">有效性</th>
      <th style="padding:4px 6px; border:1px solid #ddd; font-size:10px;" title="Robustness check α=0.05">α=.05</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">CAAR(1)%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">CAAR(3)%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">CAAR(5)%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;" title="利好新闻日 CAAR(0,5)">利好日%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;" title="利空新闻日 CAAR(0,5)">利空日%</th>
      <th style="padding:4px 6px; border:1px solid #ddd;">p̄</th>
    </tr>`;

    for (const r of rows) {
      const runDisplay = getRunDisplayName(r.run);
      // 有效性标签
      let effTag, effColor;
      if (r.efficient === 'efficient') {
        effTag = '✅ Consistent'; effColor = '#1a7f37';
      } else if (r.efficient === 'inefficient_grouped') {
        effTag = '⚠️ Conditional'; effColor = '#cf222e';
      } else {
        effTag = '❌ Against'; effColor = '#cf222e';
      }
      let effDetail = '';
      if (r.sig_horizons && r.sig_horizons.length > 0) effDetail += `h=${r.sig_horizons.join(',')}`;
      if (r.sig_groups && r.sig_groups.length > 0) effDetail += (effDetail ? ' ' : '') + r.sig_groups.join(',');
      const bg = r.efficient === 'efficient' ? '#f0fff4' : '#fff5f5';
      const medal = r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : '';
      html += `<tr style="background:${bg};">`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:center;">${medal}${r.rank}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; max-width:280px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${r.run}">${runDisplay}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${r.n_events}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right; font-weight:bold; color:${scoreColor(r.score)};">${fmt(r.score, 3)}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${fmt(r.abs_caar, 3)}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${fmt(r.car_std, 3)}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${fmt(r.ci_width, 3)}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${fmt(r.drift, 3)}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:center; white-space:nowrap;"><span style="color:${effColor}; font-weight:bold;">${effTag}</span>${effDetail ? '<br><span style="font-size:10px; color:#888;">' + effDetail + '</span>' : ''}</td>`;
      // α=0.05 robustness
      let eff05Tag, eff05Color;
      if (r.efficient_05 === 'efficient') { eff05Tag = '✅'; eff05Color = '#1a7f37'; }
      else if (r.efficient_05 === 'inefficient_grouped') { eff05Tag = '⚠️'; eff05Color = '#cf222e'; }
      else { eff05Tag = '❌'; eff05Color = '#cf222e'; }
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:center;"><span style="color:${eff05Color};">${eff05Tag}</span></td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${r.caar_1 >= 0 ? '+' : ''}${fmt(r.caar_1, 3)}${pStars(r.p_1)}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${r.caar_3 >= 0 ? '+' : ''}${fmt(r.caar_3, 3)}${pStars(r.p_3)}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${r.caar_5 >= 0 ? '+' : ''}${fmt(r.caar_5, 3)}${pStars(r.p_5)}</td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right; font-size:10px;">${r.caar_pos_5 != null ? (r.caar_pos_5 >= 0 ? '+' : '') + fmt(r.caar_pos_5, 2) + pStars(r.p_pos_5) : '—'}<br><span style="color:#999;">(n=${r.n_pos || 0})</span></td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right; font-size:10px;">${r.caar_neg_5 != null ? (r.caar_neg_5 >= 0 ? '+' : '') + fmt(r.caar_neg_5, 2) + pStars(r.p_neg_5) : '—'}<br><span style="color:#999;">(n=${r.n_neg || 0})</span></td>`;
      html += `<td style="padding:3px 6px; border:1px solid #ddd; text-align:right;">${fmt(r.p_avg, 3)}</td>`;
      html += `</tr>`;
    }
    html += `</table>`;

    // 简要结论
    const effCount = rows.filter(r => r.efficient === 'efficient').length;
    const partCount = rows.filter(r => r.efficient === 'partial').length;
    const ineffCount = rows.filter(r => r.efficient === 'inefficient' || r.efficient === 'inefficient_grouped').length;
    const grpIneffCount = rows.filter(r => r.efficient === 'inefficient_grouped').length;
    const top3 = rows.slice(0, 3).map(r => getRunDisplayName(r.run)).join('、');
    const bot3 = rows.slice(-3).reverse().map(r => getRunDisplayName(r.run)).join('、');
    html += `<div style="margin-top:12px; padding:10px; background:#fafafa; border:1px solid #eee; border-radius:6px; font-size:12px; line-height:1.8;">`;
    html += `<b>统计汇总</b>：<span style="color:#1a7f37;">✅ 有效 ${effCount}</span> / <span style="color:#9a6700;">⚠️ 漂移 ${partCount}</span> / <span style="color:#cf222e;">❌ 无效 ${ineffCount}${grpIneffCount > 0 ? '(分组' + grpIneffCount + ')' : ''}</span>（共 ${rows.length} 个实验）<br>`;
    html += `<b>最有效</b>：${top3}<br>`;
    html += `<b>最不有效</b>：${bot3}<br>`;
    html += `<span style="color:#999;">判定标准 (α=0.10, Market-Adjusted Model)：基于 Block Bootstrap p-value (B=2000, block=5)。Consistent=所有CAAR及分组 boot_p≥0.10 | Conditional=整体不显著但分组显著 | Against=整体CAAR显著<br>Ex-ante分组：twitter-xlm-roberta-base-sentiment 情感模型(事前分组, 无look-ahead bias) | t检验仅供对照 | †p<0.10 *p<0.05 **p<0.01 ***p<0.001</span>`;
    html += `</div></div>`;

    const container = document.createElement('div');
    container.className = 'chart-container';
    container.innerHTML = `
      <div class="chart-header">
        <span class="chart-title" ondblclick="editChartTitle(this)">🏆 市场效率排名</span>
        <div class="chart-actions">
          <button class="btn btn-xs btn-danger" onclick="this.closest('.chart-container').remove()">✕</button>
        </div>
      </div>
      <div style="background:var(--card); border-radius:0 0 8px 8px;">${html}</div>`;
    chartArea.insertBefore(container, chartArea.firstChild);

  } catch (e) {
    document.getElementById(loadingId)?.remove();
    showToast(`效率排名请求失败: ${e.message}`, 'error');
  }
}

// ──────── CAR/CAAR 统计检验 ────────
async function runCARTests() {
  const runs = Array.from(selectedRuns);
  if (runs.length === 0) {
    showToast('请先选择至少一个实验', 'warn');
    return;
  }

  const chartArea = document.getElementById('chartArea');

  for (const run of runs) {
    try {
      const res = await fetch(`/api/car_tests?run=${encodeURIComponent(run)}`);
      const data = await res.json();
      if (data.error) {
        showToast(`${run}: ${data.error}`, 'error');
        continue;
      }

      const t = data.tests;
      const runDisplay = getRunDisplayName(run);

      // 显著性星号
      function stars(p) {
        if (p == null) return '';
        if (p < 0.001) return ' ***';
        if (p < 0.01) return ' **';
        if (p < 0.05) return ' *';
        if (p < 0.10) return ' †';
        return '';
      }
      function fmt(v, dec) {
        if (v == null) return '—';
        return Number(v).toFixed(dec || 4);
      }
      function pFmt(v) {
        if (v == null) return '—';
        if (v < 0.001) return '<0.001';
        return v.toFixed(4);
      }

      // 构建 HTML 表格
      let html = `<div style="padding:16px; font-family:monospace;">`;
      html += `<h3 style="margin-bottom:12px;">📊 ${runDisplay} — CAR/CAAR 统计检验</h3>`;

      // Panel A: CAAR 显著性 (Market-Adjusted Model)
      html += `<h4 style="margin:8px 0 4px;">Panel A: CAAR 显著性检验 (Market-Adjusted, Block Bootstrap, H₀: CAAR = 0, α=0.10)</h4>`;
      html += `<table style="border-collapse:collapse; font-size:12px; width:100%;">`;
      html += `<tr style="background:#f0f0f0;"><th style="padding:4px 8px; border:1px solid #ddd;">Horizon</th>
        <th>CAAR(%)</th><th>SE(%)</th><th>t-stat</th><th>p(t)</th><th>p(boot)</th>
        <th>95% CI(%)</th><th>Boot 95% CI(%)</th><th>n</th><th>结论</th></tr>`;
      for (const h of [1, 3, 5]) {
        const p = t[`p_value_${h}`];
        const bp = t[`boot_p_${h}`];
        const sig = bp != null && bp < 0.10;
        const bgColor = sig ? '#fff3f3' : '#f3fff3';
        html += `<tr style="background:${bgColor};">`;
        html += `<td style="padding:4px 8px; border:1px solid #ddd; font-weight:bold;">CAR(0,${h})</td>`;
        html += `<td style="border:1px solid #ddd; text-align:right;">${fmt(t[`caar_${h}`])}${stars(p)}</td>`;
        html += `<td style="border:1px solid #ddd; text-align:right;">${fmt(t[`se_${h}`])}</td>`;
        html += `<td style="border:1px solid #ddd; text-align:right;">${fmt(t[`t_stat_${h}`], 3)}</td>`;
        html += `<td style="border:1px solid #ddd; text-align:right;">${pFmt(p)}</td>`;
        html += `<td style="border:1px solid #ddd; text-align:right;">${pFmt(bp)}</td>`;
        html += `<td style="border:1px solid #ddd; text-align:center;">[${fmt(t[`ci_lower_${h}`])}, ${fmt(t[`ci_upper_${h}`])}]</td>`;
        html += `<td style="border:1px solid #ddd; text-align:center;">[${fmt(t[`boot_ci_lower_${h}`])}, ${fmt(t[`boot_ci_upper_${h}`])}]</td>`;
        html += `<td style="border:1px solid #ddd; text-align:right;">${t[`n_${h}`] ?? '—'}</td>`;
        html += `<td style="border:1px solid #ddd; text-align:center;">${sig ? '❌ 显著≠0' : '✅ 不显著'}</td>`;
        html += `</tr>`;
      }
      html += `</table>`;

      // Panel B: 新闻情绪分组检验 (ex-ante)
      html += `<h4 style="margin:12px 0 4px;">Panel B: 新闻情绪分组 CAAR 检验 (Ex-ante, 双尾 α=0.10)</h4>`;
      html += `<p style="font-size:11px; color:#666; margin:0 0 4px;">用 twitter-xlm-roberta-base-sentiment 模型对新闻标题打分并分为利好/利空日（Ex-ante，无 look-ahead bias），检验各组 CAAR(0,h) 是否≠0</p>`;
      html += `<table style="border-collapse:collapse; font-size:12px; width:100%;">`;
      html += `<tr style="background:#f0f0f0;"><th style="padding:4px 8px; border:1px solid #ddd;">组别</th>
        <th>Horizon</th><th>CAAR(%)</th><th>SE(%)</th><th>t-stat</th><th>p(t)</th><th>p(boot)</th><th>n</th><th>结论(α=0.10)</th></tr>`;
      for (const [grp, label] of [['pos', '📈 利好新闻日'], ['neg', '📉 利空新闻日']]) {
        const nGrp = t[`n_${grp}`] ?? 0;
        for (const h of [1, 3, 5]) {
          const caar_g = t[`caar_${grp}_${h}`];
          const se_g = t[`se_${grp}_${h}`];
          const t_g = t[`t_${grp}_${h}`];
          const p_g = t[`p_${grp}_${h}`];
          const bp_g = t[`boot_p_${grp}_${h}`];
          const sig = bp_g != null && bp_g < 0.10;
          const bgColor = sig ? '#fff3f3' : '#f3fff3';
          html += `<tr style="background:${bgColor};">`;
          html += `<td style="padding:4px 8px; border:1px solid #ddd;">${label} (n=${nGrp})</td>`;
          html += `<td style="border:1px solid #ddd; text-align:center;">h=${h}</td>`;
          html += `<td style="border:1px solid #ddd; text-align:right;">${fmt(caar_g)}${stars(bp_g)}</td>`;
          html += `<td style="border:1px solid #ddd; text-align:right;">${fmt(se_g)}</td>`;
          html += `<td style="border:1px solid #ddd; text-align:right;">${fmt(t_g, 3)}</td>`;
          html += `<td style="border:1px solid #ddd; text-align:right; font-weight:bold;">${pFmt(p_g)}</td>`;
          html += `<td style="border:1px solid #ddd; text-align:right;">${pFmt(bp_g)}</td>`;
          html += `<td style="border:1px solid #ddd; text-align:right;">${nGrp}</td>`;
          html += `<td style="border:1px solid #ddd; text-align:center;">${sig ? '❌ 异常收益' : '✅ 有效吸收'}</td>`;
          html += `</tr>`;
        }
      }
      html += `</table>`;
      html += `<p style="font-size:11px; color:#999; margin-top:4px;">分组依据（Ex-ante）：用 twitter-xlm-roberta-base-sentiment 情感模型对新闻标题打分，score = p(pos)−p(neg)，每日均值>0为利好日、<0为利空日。</p>`;

      // Panel C: 解读摘要
      html += `<h4 style="margin:12px 0 4px;">Panel C: 市场效率判断</h4>`;
      html += `<div style="background:#fafafa; padding:10px; border:1px solid #eee; border-radius:6px; font-size:12px; line-height:1.8;">`;

      // 判定以 block bootstrap p 为主（t-test 仅作对照）
      const allCAARInsig = [1, 3, 5].every(h => {
        const bp = t[`boot_p_${h}`];
        return bp == null || bp >= 0.10;
      });

      // 分组检验：利好/利空组 h=1,3,5 bootstrap p < 0.10
      const groupSigs = [];
      for (const [grp, label] of [['pos', '利好新闻'], ['neg', '利空新闻']]) {
        for (const h of [1, 3, 5]) {
          const bp_g = t[`boot_p_${grp}_${h}`] ?? 1;
          if (bp_g != null && bp_g < 0.10) {
            const caar_g = t[`caar_${grp}_${h}`] ?? 0;
            const p_g = t[`p_${grp}_${h}`] ?? 1;
            groupSigs.push({grp, label, h, p: p_g, caar: caar_g});
          }
        }
      }
      const anyGroupSig = groupSigs.length > 0;

      if (!allCAARInsig) {
        html += `<b style="color:#cf222e;">Evidence against semi-strong efficiency</b><br>`;
        html += `CAAR 显著不为零 (α=0.10)，存在统计显著的异常收益，表明新闻信息未被完全或迅速纳入价格。`;
        const posH = [1, 3, 5].filter(h => (t[`caar_${h}`] ?? 0) > 0 && (t[`boot_p_${h}`] ?? 1) < 0.10);
        const negH = [1, 3, 5].filter(h => (t[`caar_${h}`] ?? 0) < 0 && (t[`boot_p_${h}`] ?? 1) < 0.10);
        if (posH.length > 0) html += `<br>→ h=${posH.join(',')} 存在显著正异常收益（反应不足/持续动量）`;
        if (negH.length > 0) html += `<br>→ h=${negH.join(',')} 存在显著负异常收益（过度反应/恐慌）`;
      } else if (anyGroupSig) {
        html += `<b style="color:#cf222e;">Conditional evidence against efficiency</b><br>`;
        html += `整体 CAAR 不显著（利好/利空抵消），但按新闻情绪 ex-ante 分组后存在显著异常收益，表明市场对不同类型信息的定价效率存在差异：`;
        for (const s of groupSigs) {
          const interp = s.grp === 'pos'
              ? (s.caar > 0 ? '利好新闻后持续正收益（反应不足/动量）' : '利好新闻后负收益（过度反应/反转）')
              : (s.caar < 0 ? '利空新闻后持续负收益（反应不足/恐慌延续）' : '利空新闻后正收益（过度反应/反转）');
          html += `<br>→ ${s.label}日 h=${s.h}: CAAR=${(s.caar).toFixed(2)}%(p=${s.p.toFixed(4)}) — ${interp}`;
        }
      } else {
        html += `<b style="color:#1a7f37;">Consistent with semi-strong efficiency</b><br>`;
        html += `所有 CAAR 不显著异于零，新闻情绪分组检验亦不显著 (双尾 α=0.10)，信息被迅速纳入价格。`;
      }

      // 辅助信息：延迟吸收(drift) — 不参与判定，仅供参考
      const driftPairs = [['1', '3'], ['3', '5']];
      const driftInfos = [];
      for (const [h1, h2] of driftPairs) {
        const dp = t[`delta_p_${h1}_${h2}`];
        if (dp != null && dp < 0.10) {
          const dv = t[`delta_${h1}_${h2}`];
          driftInfos.push(`CAR(0,${h2})−CAR(0,${h1})=${dv != null ? dv.toFixed(3) + '%' : '?'}(p=${dp.toFixed(4)})`);
        }
      }
      if (driftInfos.length > 0) {
        html += `<br><span style="color:#9a6700; font-size:11px;">📌 辅助信息 — 增量漂移: ${driftInfos.join('; ')}（仅供参考，不影响判定）</span>`;
      }

      // Robustness: α=0.05
      const allInsig05 = [1, 3, 5].every(h => (t[`boot_p_${h}`] ?? 1) >= 0.05);
      const anyGrpSig05 = ['pos', 'neg'].some(grp => [1, 3, 5].some(h => (t[`boot_p_${grp}_${h}`] ?? 1) < 0.05));
      let rob05;
      if (!allInsig05) rob05 = 'Against';
      else if (anyGrpSig05) rob05 = 'Conditional';
      else rob05 = 'Consistent';
      const rob05Color = rob05 === 'Consistent' ? '#1a7f37' : '#cf222e';
      html += `<br><span style="font-size:11px; color:${rob05Color};">Robustness (α=0.05): <b>${rob05}</b></span>`;
      html += `</div>`;

      html += `<p style="margin-top:8px; font-size:11px; color:#999;">†p<0.10, *p<0.05, **p<0.01, ***p<0.001 | 判定基于 Block Bootstrap p (B=2000, block=5) | t-test 仅供对照 | 正常收益: Market-Adjusted Model</p>`;
      html += `</div>`;

      // 创建图表容器展示
      const containerId = `test_${Date.now()}_${run}`;
      const container = document.createElement('div');
      container.className = 'chart-container';
      container.innerHTML = `
        <div class="chart-header">
          <span class="chart-title" ondblclick="editChartTitle(this)">📊 ${runDisplay} 统计检验</span>
          <div class="chart-actions">
            <button class="btn btn-xs btn-danger" onclick="this.closest('.chart-container').remove()">✕</button>
          </div>
        </div>
        <div style="background:var(--card); border-radius:0 0 8px 8px;">${html}</div>`;
      chartArea.insertBefore(container, chartArea.firstChild);

    } catch (e) {
      showToast(`${run}: 请求失败 - ${e.message}`, 'error');
    }
  }
}

function toggleGridLines() {

// ──────── 导出 PNG ────────
function _getChartFromBtn(btn) {
  const container = btn.closest('.chart-container');
  const chartDiv = container.querySelector('.chart-box');
  return chartInstances.find(c => c.getDom() === chartDiv);
}

function _getChartTitle(btn) {
  const container = btn.closest('.chart-container');
  const span = container.querySelector('.chart-title > span');
  return span ? span.textContent.trim() : 'chart';
}

// ──────── 导出时临时隐藏 dataZoom 滑块 ────────
function _hideDataZoom(chart) {
  const opt = chart.getOption();
  const dz = opt.dataZoom;
  if (!dz || dz.length === 0) return null;
  const saved = dz.map((d, i) => ({ index: i, show: d.show }));
  chart.setOption({ dataZoom: dz.map((d, i) => d.type === 'slider' ? { id: d.id, show: false } : {}) }, false);
  return saved;
}
function _restoreDataZoom(chart, saved) {
  if (!saved) return;
  const restore = saved.map(s => ({ show: s.show !== false }));
  chart.setOption({ dataZoom: restore }, false);
}

function exportChartPng(btn) {
  const chart = _getChartFromBtn(btn);
  if (!chart) return;
  const saved = _hideDataZoom(chart);
  const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
  _restoreDataZoom(chart, saved);
  const a = document.createElement('a');
  a.href = url;
  a.download = _getChartTitle(btn).replace(/[\/\\:*?"<>|]/g, '_') + '.png';
  a.click();
}

// ──────── 导出黑白 PNG ────────
function exportChartBW(btn) {
  const chart = _getChartFromBtn(btn);
  if (!chart) return;
  const saved = _hideDataZoom(chart);
  const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
  _restoreDataZoom(chart, saved);
  const img = new Image();
  img.onload = function() {
    const cvs = document.createElement('canvas');
    cvs.width = img.width;
    cvs.height = img.height;
    const ctx = cvs.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, cvs.width, cvs.height);
    const d = imageData.data;
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
      d[i] = d[i+1] = d[i+2] = gray;
    }
    ctx.putImageData(imageData, 0, 0);
    const a = document.createElement('a');
    a.href = cvs.toDataURL('image/png');
    a.download = _getChartTitle(btn).replace(/[\/\\:*?"<>|]/g, '_') + '_bw.png';
    a.click();
  };
  img.src = url;
}

// ──────── 导出 PDF（直接生成，无打印对话框）────────
function exportChartPdf(btn) {
  const chart = _getChartFromBtn(btn);
  if (!chart) return;
  const title = _getChartTitle(btn).replace(/[\/\\:*?"<>|]/g, '_');
  const saved = _hideDataZoom(chart);
  const url = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
  _restoreDataZoom(chart, saved);
  const img = new Image();
  img.onload = function() {
    const imgW = img.width;
    const imgH = img.height;
    // 页面尺寸 = 图片尺寸（px → mm，按 72dpi），无留白
    const pxToMm = 25.4 / 72;
    const pageW = imgW * pxToMm;
    const pageH = imgH * pxToMm;
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: pageW >= pageH ? 'landscape' : 'portrait', unit: 'mm', format: [pageW, pageH] });
    pdf.addImage(url, 'PNG', 0, 0, pageW, pageH);
    pdf.save(title + '.pdf');
  };
  img.src = url;
}

// ──────── 保存快照到后端文件系统 ────────
let _savedGalleryCache = [];  // 缓存 gallery 列表（只含 filename/title/thumbUrl/time）

async function _fetchSavedList() {
  try {
    const resp = await fetch('/api/saved_charts');
    if (!resp.ok) return [];
    return await resp.json();
  } catch { return []; }
}

async function _fetchSavedFull(filename) {
  const resp = await fetch(`/api/saved_charts/${encodeURIComponent(filename)}`);
  if (!resp.ok) return null;
  return await resp.json();
}

async function saveChartSnapshot(btn) {
  const chart = _getChartFromBtn(btn);
  if (!chart) return;
  const title = _getChartTitle(btn);
  const thumbUrl = chart.getDataURL({ type: 'png', pixelRatio: 0.5, backgroundColor: '#ffffff' });
  const option = chart.getOption();
  const container = btn.closest('.chart-container');
  const chartBox = container.querySelector('.chart-box');
  const boxH = chartBox.style.height || '';
  const boxW = chartBox.style.width || '';
  const savedAxisNames = {
    x: (option.xAxis || []).map(ax => ax.name || ''),
    y: (option.yAxis || []).map(ax => ax.name || '')
  };
  // 保存滑块状态
  const bwSlider = container.querySelector('.bar-width-slider');
  const bcwSlider = container.querySelector('.bar-cat-width-slider');
  const barSliders = {
    barWidth: bwSlider ? bwSlider.value : null,
    barCatWidth: bcwSlider ? bcwSlider.value : null
  };
  // 提取标记间隔/大小元数据（symbolSize 为函数时 JSON.stringify 会丢弃）
  const markerMeta = (option.series || []).map(s => {
    if (typeof s.symbolSize === 'function') {
      const sz = s.symbolSize(0, { dataIndex: 0 });
      let interval = 0;
      if (sz > 0) {
        const sz1 = s.symbolSize(0, { dataIndex: 1 });
        if (sz1 === 0) {
          for (let k = 2; k < 500; k++) {
            if (s.symbolSize(0, { dataIndex: k }) > 0) { interval = k; break; }
          }
        }
      }
      s.symbolSize = sz || 6; // 替换为数字以便序列化
      return { baseSize: sz || 6, interval };
    }
    return null;
  });
  const payload = { title, thumbUrl, option, boxH, boxW, barSliders, markerMeta, defaults: savedAxisNames, time: new Date().toLocaleString('zh-CN') };
  btn.textContent = '保存中…';
  try {
    const resp = await fetch('/api/saved_charts', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });
    if (!resp.ok) throw new Error('保存失败');
    btn.textContent = '已保存';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = '保存'; btn.classList.remove('saved'); }, 2000);
    await renderSavedGallery();
  } catch (e) {
    btn.textContent = '失败';
    showToast('保存失败: ' + e.message, 'error');
    setTimeout(() => { btn.textContent = '保存'; }, 2000);
  }
}

async function renderSavedGallery() {
  _savedGalleryCache = await _fetchSavedList();
  const saved = _savedGalleryCache;
  const section = document.getElementById('savedSection');
  const grid = document.getElementById('savedGrid');
  const countEl = document.getElementById('savedCount');
  countEl.textContent = saved.length;
  if (saved.length === 0) { section.style.display = 'none'; return; }
  section.style.display = 'block';
  grid.innerHTML = saved.map((item, idx) => `
    <div class="saved-card" onclick="restoreSaved(${idx})" title="点击恢复到编辑区">
      <img src="${item.thumbUrl || ''}" alt="${escapeHtml(item.title)}">
      <div class="saved-card-footer">
        <span class="saved-title" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</span>
        <span class="saved-actions">
          <button class="btn btn-xs" onclick="event.stopPropagation(); downloadSaved(${idx})">下载</button>
          <button class="btn btn-xs btn-danger" onclick="event.stopPropagation(); removeSaved(${idx})">删除</button>
        </span>
      </div>
    </div>
  `).join('');
}

async function restoreSaved(idx) {
  const meta = _savedGalleryCache[idx];
  if (!meta) return;
  showToast('正在加载…', 'info');
  const item = await _fetchSavedFull(meta.filename);
  if (!item || !item.option) {
    showToast('加载失败或格式不兼容', 'error');
    return;
  }

  const chartArea = document.getElementById('chartArea');
  const empty = chartArea.querySelector('.empty-state');
  if (empty) empty.remove();

  const containerId = `chart_restored_${Date.now()}_${idx}`;
  const extraH = item.boxH ? parseInt(item.boxH) : null;
  const container = _buildChartContainer(containerId, item.title, extraH);
  chartArea.insertBefore(container, chartArea.firstChild);

  // 恢复宽度
  if (item.boxW) {
    const cbox = container.querySelector('.chart-box');
    if (cbox) cbox.style.width = item.boxW;
  }

  const chart = echarts.init(document.getElementById(containerId));
  chartInstances.push(chart);
  chart.setOption(item.option);
  // 恢复标记间隔函数（JSON 反序列化后 symbolSize 函数会丢失）
  if (item.markerMeta) {
    const seriesUpd = item.markerMeta.map((m, idx) => {
      if (m && m.interval > 0 && m.baseSize > 0) {
        const n = m.interval, sz = m.baseSize;
        return { symbolSize: function(_val, params) { return params.dataIndex % n === 0 ? sz : 0; }, showAllSymbol: true };
      }
      return {};
    });
    chart.setOption({ series: seriesUpd }, false);
  }
  _autoYAxisGap(chart);
  _makeChartResizable(container);

  // 恢复柱宽滑块
  const hasBars = (item.option.series || []).some(s => s.type === 'bar');
  if (hasBars) {
    _showBarWidthCtrl(container);
    const bs = item.barSliders || {};
    const firstBar = (item.option.series || []).find(s => s.type === 'bar') || {};
    // 优先用保存的滑块值，其次从 option.series 读取
    const bwVal = bs.barWidth || (firstBar.barWidth ? parseInt(firstBar.barWidth) : null);
    const bcwVal = bs.barCatWidth || null;
    if (bwVal) {
      const slider = container.querySelector('.bar-width-slider');
      const valEl = container.querySelector('.bar-width-val');
      if (slider && valEl) { slider.value = bwVal; valEl.textContent = bwVal + 'px'; }
    }
    if (bcwVal) {
      const slider = container.querySelector('.bar-cat-width-slider');
      const valEl = container.querySelector('.bar-cat-width-val');
      if (slider && valEl) { slider.value = bcwVal; valEl.textContent = bcwVal + '%'; }
    }
  }

  if (item.defaults) {
    chartDefaultAxisNames.set(chart, item.defaults);
  } else {
    _saveDefaultAxisNames(chart);
  }

  container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  showToast(`已恢复图表「${item.title}」到编辑区`, 'success');
}

async function downloadSaved(idx) {
  const meta = _savedGalleryCache[idx];
  if (!meta) return;
  const item = await _fetchSavedFull(meta.filename);
  if (!item) return;
  const fname = item.title.replace(/[\/\\:*?"<>|]/g, '_') + '.png';
  if (item.option) {
    const tmpDiv = document.createElement('div');
    tmpDiv.style.cssText = 'position:absolute;left:-9999px;width:1200px;height:800px;';
    document.body.appendChild(tmpDiv);
    const tmpChart = echarts.init(tmpDiv);
    tmpChart.setOption(item.option);
    const url = tmpChart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
    tmpChart.dispose();
    document.body.removeChild(tmpDiv);
    const a = document.createElement('a');
    a.href = url; a.download = fname; a.click();
  } else if (meta.thumbUrl) {
    const a = document.createElement('a');
    a.href = meta.thumbUrl; a.download = fname; a.click();
  }
}

async function removeSaved(idx) {
  const meta = _savedGalleryCache[idx];
  if (!meta) return;
  await fetch(`/api/saved_charts/${encodeURIComponent(meta.filename)}`, { method: 'DELETE' });
  await renderSavedGallery();
}

async function clearAllSaved() {
  if (!confirm('确定清空所有已保存的图表？')) return;
  const promises = _savedGalleryCache.map(m =>
    fetch(`/api/saved_charts/${encodeURIComponent(m.filename)}`, { method: 'DELETE' })
  );
  await Promise.all(promises);
  await renderSavedGallery();
}

function scrollToSaved() {
  const section = document.getElementById('savedSection');
  if (section) section.scrollIntoView({ behavior: 'smooth' });
}

// ──────── 迁移 localStorage 旧图到后端 ────────
async function _migrateLocalStorage() {
  const SAVED_KEY = 'mentalmarket_eval_saved_charts';
  const MIGRATED_KEY = 'mentalmarket_eval_migrated';
  if (localStorage.getItem(MIGRATED_KEY)) return; // 已迁移过
  let old;
  try { old = JSON.parse(localStorage.getItem(SAVED_KEY) || '[]'); } catch { return; }
  if (!old.length) { localStorage.setItem(MIGRATED_KEY, '1'); return; }
  console.log(`迁移 ${old.length} 个 localStorage 图表到后端…`);
  let ok = 0;
  // 倒序导入使得最新的排在前面（后端按文件名倒序）
  for (const item of old.reverse()) {
    try {
      const resp = await fetch('/api/saved_charts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(item),
      });
      if (resp.ok) ok++;
    } catch {}
  }
  localStorage.setItem(MIGRATED_KEY, '1');
  console.log(`迁移完成: ${ok}/${old.length}`);
  if (ok > 0) showToast(`已从浏览器缓存迁移 ${ok} 个图表到服务端`, 'success');
}

// ──────── Y 轴范围自定义 ────────
function applyYRange() {
  const minVal = document.getElementById('yMinInput').value.trim();
  const maxVal = document.getElementById('yMaxInput').value.trim();
  const yMin = minVal !== '' ? parseFloat(minVal) : null;
  const yMax = maxVal !== '' ? parseFloat(maxVal) : null;
  if (yMin === null && yMax === null) { showToast('请输入至少一个值', 'warn'); return; }
  chartInstances.forEach(chart => {
    const opt = chart.getOption();
    const yAxes = opt.yAxis || [];
    const updates = yAxes.map(() => {
      const u = {};
      if (yMin !== null && !isNaN(yMin)) u.min = yMin;
      if (yMax !== null && !isNaN(yMax)) u.max = yMax;
      return u;
    });
    chart.setOption({ yAxis: updates }, false);
  });
  showToast(`Y轴范围已设为 [${yMin ?? 'auto'}, ${yMax ?? 'auto'}]`, '');
}

function resetYRange() {
  document.getElementById('yMinInput').value = '';
  document.getElementById('yMaxInput').value = '';
  chartInstances.forEach(chart => {
    const opt = chart.getOption();
    const updates = (opt.yAxis || []).map(() => ({ min: null, max: null }));
    chart.setOption({ yAxis: updates }, false);
  });
  showToast('Y轴范围已重置为自动', '');
}

// ──────── F1: 图表联动 / 同步缩放 ────────
(function setupSyncZoom() {
  let _syncing = false;
  window._onDataZoom = function(params, sourceChart) {
    if (_syncing || !document.getElementById('syncZoomToggle').checked) return;
    _syncing = true;
    const opt = sourceChart.getOption();
    const dz = opt.dataZoom;
    if (!dz || dz.length === 0) { _syncing = false; return; }
    const start = dz[0].start, end = dz[0].end;
    chartInstances.forEach(c => {
      if (c === sourceChart) return;
      const co = c.getOption();
      if (co.dataZoom && co.dataZoom.length > 0) {
        c.dispatchAction({ type: 'dataZoom', start, end });
      }
    });
    _syncing = false;
  };
  const _origPush = Array.prototype.push;
  const _patchChart = (chart) => {
    chart.on('datazoom', (params) => window._onDataZoom(params, chart));
  };
  const origPushCI = chartInstances.push;
  chartInstances.push = function(...args) {
    const result = _origPush.apply(this, args);
    args.forEach(c => { if (c && c.on) _patchChart(c); });
    return result;
  };
})();

// ──────── F2: 交易日标注线 ────────
function addAnnotationLine() {
  const day = prompt('输入要标注的交易日（数字）:');
  if (!day || isNaN(Number(day))) return;
  const dayNum = Number(day);
  const label = prompt('标注文字（可选）:', `Day ${dayNum}`) || `Day ${dayNum}`;
  chartInstances.forEach(chart => {
    const opt = chart.getOption();
    if (!opt.xAxis || !opt.xAxis[0]) return;
    const xType = opt.xAxis[0].type;
    if (xType === 'category') return;
    const existing = (opt.series || []).map(s => {
      const ml = s.markLine || { data: [] };
      return { markLine: { silent: true, symbol: 'none', lineStyle: { type: 'dashed', color: '#8250df', width: 1.5 },
        label: { formatter: label, fontSize: 10, color: '#8250df', position: 'start' },
        data: [...(ml.data || []), { xAxis: dayNum }] } };
    });
    if (existing.length > 0) {
      chart.setOption({ series: existing }, false);
    }
  });
  showToast(`已在所有图表添加标注线: ${label}`, '');
}

// ──────── F3: 差异高亮 / 偏差带 ────────
function toggleDeviationBand() {
  chartInstances.forEach(chart => {
    const opt = chart.getOption();
    const series = opt.series || [];
    const bandIdx = series.findIndex(s => s._isDeviationBand && s.data && s.data.length > 0);
    if (bandIdx >= 0) {
      const cleaned = series.filter(s => !s._isDeviationBand);
      chart.setOption({ series: cleaned }, { replaceMerge: ['series'] });
      showToast('已隐藏偏差带', '');
      return;
    }
    const lineSeries = series.filter(s => s.type === 'line' && s.data && s.data.length > 0 && !s._isDeviationBand);
    if (lineSeries.length < 2) return;
    const s1Data = lineSeries[0].data.map(d => Array.isArray(d) ? d : [d[0] || 0, d.value || d]);
    const s2Data = lineSeries[1].data.map(d => Array.isArray(d) ? d : [d[0] || 0, d.value || d]);
    const upperData = [], lowerData = [];
    const len = Math.min(s1Data.length, s2Data.length);
    for (let i = 0; i < len; i++) {
      const x = s1Data[i][0];
      const y1 = s1Data[i][1], y2 = s2Data[i][1];
      upperData.push([x, Math.max(y1, y2)]);
      lowerData.push([x, Math.min(y1, y2)]);
    }
    const bandSeries = [
      { type: 'line', data: lowerData, lineStyle: { width: 0 }, symbol: 'none', stack: '_devband', silent: true, _isDeviationBand: true },
      { type: 'line', data: upperData.map((p, i) => [p[0], p[1] - lowerData[i][1]]), lineStyle: { width: 0 }, symbol: 'none', stack: '_devband', areaStyle: { color: 'rgba(130,80,223,0.12)' }, silent: true, _isDeviationBand: true },
    ];
    const update = series.map(() => ({}));
    chart.setOption({ series: [...update, ...bandSeries] }, false);
  });
  showToast('偏差带已切换', '');
}

// ──────── F4: 指标相关性矩阵 ────────
async function showCorrelationMatrix() {
  if (selectedRuns.size === 0 || selectedMetrics.size < 2) {
    showToast('请选择至少1个实验和2个指标', 'warn'); return;
  }
  const catKey = document.getElementById('categorySelect').value;
  const cat = categories[catKey];
  const runs = Array.from(selectedRuns).join(',');
  const metrics = Array.from(selectedMetrics).join(',');
  const res = await fetch(`/api/data?runs=${encodeURIComponent(runs)}&category=${catKey}&metrics=${metrics}&group_filter=`);
  const data = await res.json();
  if (data.error) { showToast(data.error, 'error'); return; }

  const metricKeys = Array.from(selectedMetrics);
  const metricLabels = metricKeys.map(k => cat.metrics[k] || k);
  const seriesMap = {};
  for (const [runName, runSeries] of Object.entries(data.series)) {
    for (const [label, pts] of Object.entries(runSeries)) {
      seriesMap[label] = pts.map(p => p.y);
    }
  }
  const vectors = metricLabels.map(ml => {
    for (const [k, v] of Object.entries(seriesMap)) { if (k.includes(ml)) return v; }
    return [];
  });

  function pearson(a, b) {
    const n = Math.min(a.length, b.length);
    if (n < 3) return 0;
    const ma = a.slice(0,n).reduce((s,v)=>s+v,0)/n;
    const mb = b.slice(0,n).reduce((s,v)=>s+v,0)/n;
    let cov=0, va=0, vb=0;
    for (let i=0;i<n;i++) { const da=a[i]-ma, db=b[i]-mb; cov+=da*db; va+=da*da; vb+=db*db; }
    const d = Math.sqrt(va*vb);
    return d > 1e-15 ? cov/d : 0;
  }

  const n = metricLabels.length;
  const matData = [];
  for (let i=0;i<n;i++) for (let j=0;j<n;j++) {
    const r = i===j ? 1.0 : pearson(vectors[i], vectors[j]);
    matData.push([j, i, Math.round(r*1000)/1000]);
  }

  const chartArea = document.getElementById('chartArea');
  const empty = chartArea.querySelector('.empty-state');
  if (empty) empty.remove();
  const containerId = `chart_corr_${Date.now()}`;
  const container = _buildChartContainer(containerId, `指标相关性矩阵 — ${cat.label}`, 400);
  chartArea.insertBefore(container, chartArea.firstChild);
  const chart = echarts.init(document.getElementById(containerId));
  chartInstances.push(chart);
  chart.setOption({
    backgroundColor: 'transparent',
    tooltip: { formatter: p => `${metricLabels[p.value[1]]} × ${metricLabels[p.value[0]]}: ${p.value[2]}` },
    grid: { top: 10, right: 80, bottom: 60, left: 100 },
    xAxis: { type: 'category', data: metricLabels, axisLabel: { rotate: 30, fontSize: 10, color: '#656d76' }, splitArea: { show: true } },
    yAxis: { type: 'category', data: metricLabels, axisLabel: { fontSize: 10, color: '#656d76' }, splitArea: { show: true } },
    visualMap: { min: -1, max: 1, calculable: true, orient: 'vertical', right: 10, top: 'center', inRange: { color: ['#cf222e','#ffffff','#0969da'] }, textStyle: { color: '#656d76' } },
    series: [{ type: 'heatmap', data: matData, label: { show: n<=8, fontSize: 10, color: '#1f2328' }, itemStyle: { borderWidth: 1, borderColor: '#ffffff' } }],
  });
}

// ──────── F5: 统计摘要卡片 ────────
function toggleStatsBar(btn) {
  const container = btn.closest('.chart-container');
  const existing = container.querySelector('.stats-bar');
  if (existing) {
    existing.remove();
    return;
  }
  const chartDiv = container.querySelector('.chart-box');
  const chart = chartInstances.find(c => c.getDom() === chartDiv);
  if (!chart) return;
  const opt = chart.getOption();
  const seriesData = {};
  (opt.series || []).forEach(s => {
    if (s.data && s.data.length > 1) seriesData[s.name || ''] = s.data;
  });
  const bar = _buildStatsBar(seriesData);
  if (bar) {
    const titleDiv = container.querySelector('.chart-title');
    titleDiv.after(bar);
  }
}

function _buildStatsBar(seriesData) {
  const bar = document.createElement('div');
  bar.className = 'stats-bar';
  const header = document.createElement('div');
  header.className = 'stats-bar-header';
  header.innerHTML = '<span class="arrow">▾</span> 统计摘要';
  header.onclick = () => bar.classList.toggle('collapsed');
  bar.appendChild(header);
  const content = document.createElement('div');
  content.className = 'stats-bar-content';
  let hasData = false;
  for (const [name, pts] of Object.entries(seriesData)) {
    if (!pts || pts.length === 0) continue;
    const ys = pts.map(p => typeof p === 'number' ? p : (p.y != null ? p.y : (Array.isArray(p) ? p[1] : 0)));
    const n = ys.length;
    const mean = ys.reduce((a,b)=>a+b,0)/n;
    const std = Math.sqrt(ys.reduce((a,v)=>a+(v-mean)**2,0)/n);
    const mn = Math.min(...ys), mx = Math.max(...ys);
    const last = ys[n-1];
    content.innerHTML += `<span class="stat-chip">${name}: <b>μ=${_smartFmt(mean)}</b> σ=${_smartFmt(std)} ↓${_smartFmt(mn)} ↑${_smartFmt(mx)} 末=${_smartFmt(last)}</span>`;
    hasData = true;
  }
  bar.appendChild(content);
  return hasData ? bar : null;
}


// ──────── F6: 实验分组标签系统 ────────
const runTags = {};  // {runName: Set<tag>}
const allTags = new Set();
let activeTagFilter = null;

function addTag(tag) {
  tag = tag.trim();
  if (!tag) return;
  allTags.add(tag);
  selectedRuns.forEach(rn => {
    if (!runTags[rn]) runTags[rn] = new Set();
    runTags[rn].add(tag);
  });
  renderTagBar();
  renderRunsList();
  showToast(`标签「${tag}」已添加到 ${selectedRuns.size} 个实验`, '');
}

function filterByTag(tag) {
  if (activeTagFilter === tag) { activeTagFilter = null; }
  else { activeTagFilter = tag; }
  renderTagBar();
  renderRunsList();
}

function renderTagBar() {
  const bar = document.getElementById('tagBar');
  if (allTags.size === 0) { bar.innerHTML = ''; return; }
  bar.innerHTML = Array.from(allTags).map(t =>
    `<span class="exp-tag ${activeTagFilter === t ? 'active' : ''}" onclick="filterByTag('${t.replace(/'/g,"\\'")}')">` +
    `${t} <span style="cursor:pointer;margin-left:2px;" onclick="event.stopPropagation();removeTag('${t.replace(/'/g,"\\'")}')">×</span></span>`
  ).join('');
}

function removeTag(tag) {
  allTags.delete(tag);
  for (const rn of Object.keys(runTags)) {
    runTags[rn].delete(tag);
  }
  if (activeTagFilter === tag) activeTagFilter = null;
  renderTagBar();
  renderRunsList();
}

const _origRenderRunsList = renderRunsList;
let _dragSrcIdx = null;
renderRunsList = function() {
  const el = document.getElementById('runsList');
  const filteredRuns = activeTagFilter
    ? allRuns.filter(r => runTags[r.name] && runTags[r.name].has(activeTagFilter))
    : allRuns;
  el.innerHTML = filteredRuns.map((run, idx) => {
    const tom = run.config_summary?.tom_distribution || {};
    const tomStr = Object.entries(tom).map(([k,v]) => `T${k}:${v}`).join(' ');
    const escapedName = run.name.replace(/'/g, "\\'");
    const tags = runTags[run.name] ? Array.from(runTags[run.name]).map(t => `<span class="exp-tag" style="font-size:9px;">${t}</span>`).join('') : '';
    return `
      <div class="run-item ${selectedRuns.has(run.name) ? 'selected' : ''}" draggable="true" data-idx="${idx}"
           onclick="toggleRun('${escapedName}', this)"
           ondragstart="_onDragStart(event,${idx})" ondragover="_onDragOver(event)" ondragenter="_onDragEnter(event)" ondragleave="_onDragLeave(event)" ondrop="_onDrop(event,${idx})" ondragend="_onDragEnd(event)">
        <input type="checkbox" ${selectedRuns.has(run.name) ? 'checked' : ''} onclick="event.stopPropagation(); toggleRun('${escapedName}', this.parentElement)">
        <div style="flex:1;min-width:0;">
          <div class="run-name" title="${run.name}">${run.name}</div>
          ${tags ? '<div style="margin-top:2px;">' + tags + '</div>' : ''}
        </div>
      </div>
    `;
  }).join('');
  updateSelectedCount();
};
function _onDragStart(e, idx) { _dragSrcIdx = idx; e.currentTarget.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; }
function _onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
function _onDragEnter(e) { e.currentTarget.classList.add('drag-over'); }
function _onDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function _onDragEnd(e) { e.currentTarget.classList.remove('dragging'); document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over')); }
function _onDrop(e, targetIdx) {
  e.preventDefault(); e.currentTarget.classList.remove('drag-over');
  if (_dragSrcIdx === null || _dragSrcIdx === targetIdx) return;
  const item = allRuns.splice(_dragSrcIdx, 1)[0];
  allRuns.splice(targetIdx, 0, item);
  _dragSrcIdx = null;
  renderRunsList();
}

// 启动
init();
_migrateLocalStorage().then(() => renderSavedGallery());
