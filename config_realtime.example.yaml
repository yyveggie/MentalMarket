# ╔══════════════════════════════════════════════════════════════╗
# ║           MentalMarket 实时预测模式配置                      ║
# ║  结构与主项目 config.yaml 一致，可直接由 run.py 加载          ║
# ║  增加 realtime 段控制实时数据拉取                            ║
# ╚══════════════════════════════════════════════════════════════╝

# ================================================================
#  1. 仿真核心参数
# ================================================================
simulation:
  n_agents: 10                 # 实时模式用少量 Agent 即可
  initial_price: 100.0
  random_seed: null             # 每次随机

  # --- 时间与批次 ---
  max_sim_time: 999999999      # 持续运行直到手动停止（配合 market_hours_only 自动盘后休眠）
  snapshot_interval: 14400     # 1 个仿真交易日 = 1 个实际交易日
  batch_size: 10               # 少量 Agent 小批次即可
  batch_timeout: 120
  event_window: 60.0           # 1 分钟事件窗口（实时模式减小窗口提高响应性）

  # --- 订单簿与撮合 ---
  fee_rate: 0.0002
  l2_depth: 5
  l2_history_max: 5000
  price_history_maxlen: 10000

  # --- 安全与阈值 ---
  max_consecutive_failures: 5
  market_trend_threshold: 0.001
  price_discovery_min_trades: 10

  # --- 延迟模型（实时模式：全部归零，信息同步可见） ---
  delay_model_by_tom:
    0:
      perception: {min: 0, max: 0}
      decision:   {min: 0, max: 0}
      submit:     {min: 0, max: 0}
      report:     {min: 0, max: 0}
    1:
      perception: {min: 0, max: 0}
      decision:   {min: 0, max: 0}
      submit:     {min: 0, max: 0}
      report:     {min: 0, max: 0}
    2:
      perception: {min: 0, max: 0}
      decision:   {min: 0, max: 0}
      submit:     {min: 0, max: 0}
      report:     {min: 0, max: 0}

  # --- ToM 阶数初始分布 ---
  tom_distribution:
    0: 0.60
    1: 0.30
    2: 0.10

# ================================================================
#  2. Agent 参数
# ================================================================
agent:
  cash_mode: equal
  cash_equal_amount: 200000

  stock_ratio_min: 0.3
  stock_ratio_max: 0.7
  index_holding_file: ""       # 实时模式从 realtime.symbols 随机分配，不需要预计算持仓
  index_holding_prob_file: ""
  index_holding_max: 3         # 实时模式标的少，每人持有少一些
  index_holding_min: 1
  min_holders_per_index: 3     # 少量 Agent 时降低门槛

  arrival_lambda:              # 轮次制下无效，保留供引擎初始化默认值
    0: 1800
    1: 1800
    2: 1800

  tool_loop_max_steps: 2
  reasoning_maxlen: 500
  tool_allowlist_by_tom:
    0: [set_trade_plan, social_action, cancel_orders]
    1: [set_trade_plan, social_action, cancel_orders]
    2: [set_trade_plan, social_action, cancel_orders, set_deception_plan]

  technical_analysis:
    trade_lookback: 200
    sma_short_period: 5
    sma_long_period: 20
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    momentum_period: 10

# ================================================================
#  3. 多指数行情（实时模式关闭，避免离线标的与实时标的不匹配）
# ================================================================
market_indices:
  enabled: false
  profile_csv: data/stock_profile.csv
  quotes_csv: data/stock_data.csv
  recent_days: 60
  start_date: "2023-06-15"
  baseline_flat_days: 0
  quotes_maxlen: 2000

# ================================================================
#  4. 订单簿参数
# ================================================================
orderbook:
  seed_levels: 15
  seed_spread_pct: 0.002
  seed_max_qty: 100
  seed_min_qty: 20
  seed_qty_decay: 4
  seed_absorption_pct: 0.25
  max_trade_log: 50000
  tick_size: 0.01
  lot_size: 1
  price_limit_pct: 0.10
  order_ttl: 7200
  buy_depth_cap: 1.0

# ================================================================
#  5. 社交网络
# ================================================================
social:
  perception_hot_k: 2
  perception_latest_k: 3
  max_posts: 1000
  candidate_pool_min: 20
  recency_half_life: 3600.0
  post_content_maxlen: 300
  retweet_preview_len: 100
  graph_enabled: true
  # KOL 身份由声誉双阈值动态判定（滞后）
  kol_reputation_threshold: 2.5        # 实时模式 agent 数量少，降低 KOL 阈值
  kol_reputation_loss_threshold: 1.5
  follow_random_min: 1
  follow_random_max: 3
  scoring:
    retweet_weight: 2
    engagement_coeff: 2.0
    recency_coeff: 5.0
    reputation_coeff: 2.0
    social_bonus: 3.0
  reputation_enabled: true
  reputation_eval_delay: 3600
  reputation_window: 20
  reputation_initial: 1.0
  reputation_neutral_threshold: 0.2
  reputation_min_window: 3
  reputation_max_pending: 5000
  reputation_correct_weight: 0.3
  reputation_wrong_weight: 0.3
  reputation_like_weight: 0.05
  reputation_dislike_weight: 0.05
  reputation_retweet_weight: 0.1
  reputation_decay_rate: 0.97

# ================================================================
#  6. 动态演化
# ================================================================
evolution:
  enabled: false

# ================================================================
#  7. 新闻事件（离线新闻，realtime.enabled=true 时由实时新闻补充/替代）
# ================================================================
news_events_config:
  enabled: false               # 实时模式下关闭离线新闻，改用 realtime.news
  news_file: data/news.json
  news_per_day: 4
  coverage_cycle: 3
  experimental_daily_title_mode: false
  experimental_news_file: data/news2.json
  reopen_include_closed_days: true
  monday_include_weekend: true

# ================================================================
#  8. 提示词参数
# ================================================================
prompt:
  social_max_posts: 5

# ================================================================
#  9. 推理存储
# ================================================================
storage:
  base_dir: runs
  buffer_size: 100
  store_prompt: false
  checkpoint_interval: 3600    # 每小时保存一次 checkpoint（真实时间）
  checkpoint_l2_keep: 200
  checkpoint_price_keep: 5000
  checkpoint_snapshot_keep: 20
  checkpoint_trade_log_limit: 2000

# ================================================================
#  10. 实时看板
# ================================================================
dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8765
  l2_depth: 10
  l2_quote_orders: 0
  # trading_day_seconds 已自动从 snapshot_interval 读取，无需单独配置
  max_recent_events: 200
  price_trend_maxlen: 600
  sentiment_trend_maxlen: 600
  deviation_trend_maxlen: 600
  sentiment_window: 500
  social_graph_top_n: 100
  ws_push_interval: 1.0
  ws_event_queue_size: 2000
  ws_heartbeat: 20.0

# ================================================================
#  11. API 配置
# ================================================================
api:
  inference:
    temperature: 0.7
    max_tokens: 1024
    print_full_prompt: false
    debug_print: false
    colorized_print: false

  providers:
    - name: provider_1
      base_url: "<your-openai-compatible-api-base-url>"
      api_key: $MENTALMARKET_PROVIDER_1_API_KEY
      model: "<your-model-name>"
      max_concurrency: 20
      timeout: 60
      extra_body: {}

  routing:
    0: [provider_1]
    1: [provider_1]
    2: [provider_1]

# ================================================================
#  12. 实时数据源（新增，仅 realtime 模式使用）
# ================================================================
realtime:
  enabled: true                # 启用实时数据拉取（false 时退化为普通离线仿真）
  decision_interval: 1800      # 决策轮间隔（秒）：每隔 30 分钟拉取数据 + 所有 Agent 做决策
  polling_interval: 60         # 心跳间隔（秒）：引擎定期唤醒处理累积事件
  pacing: 1.0                  # 1:1 真实时间（1 仿真秒 = 1 真实秒）
  market_hours_only: true      # 仅在 A 股交易时段运行（9:30-11:30, 13:00-15:00），盘外自动休眠

  # 实时行情标的（akshare 雪球格式）
  symbols:
    - SH600000                 # 浦发银行
    - SH601318                 # 中国平安
    - SZ000001                 # 平安银行

  # 新闻源
  news:
    enabled: true
    source: sina
    page_size: 20
    max_history: 100
    dedup: true

  # 报价源
  quote:
    enabled: true
    source: akshare
    max_history: 200

  # 实时预测输出
  output:
    log_file: realtime_predictions.jsonl
    print_to_console: true
