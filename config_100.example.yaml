simulation:
  n_agents: 100
  initial_price: 100.0
  random_seed: 42

  max_sim_time: 360000         # 100 trading days at 3,600 seconds per day
  snapshot_interval: 3600      # End-of-day snapshot interval in seconds

  # --- 集合竞价（A 股制度）---
  # 开盘/收盘集合竞价时长（仿真秒，0=关闭）。按 3600s/日对应真实 09:15-09:25 与 14:57-15:00 折算：
  # 3600 × 10/337 ≈ 107s，3600 × 3/337 ≈ 32s。竞价期间只收单不撮合，结束时以单一价格集中成交；
  # 启用后未成交委托在收盘后失效，涨跌停按当日收盘价更新
  call_auction_open_seconds: 107
  call_auction_close_seconds: 32
  batch_size: 50               # Maximum agents per concurrent LLM batch
  batch_timeout: 180           # LLM batch timeout in seconds
  event_window: 600.0          # Event batching window in seconds

  fee_rate: 0.0002             # Fee charged to each side of a trade
  l2_depth: 5                  # L2 levels included in agent prompts
  l2_history_max: 5000         # Maximum cached L2 snapshots
  price_history_maxlen: 20000  # Maximum cached trade prices

  max_consecutive_failures: 5        # Stop after this many degraded batches
  market_maker_cash_multiplier: 10   # Market-maker cash multiplier
  market_trend_threshold: 0.001      # Absolute return threshold for trend detection
  price_discovery_min_trades: 10     # Minimum trades for price-discovery metrics

  # Stage delays in seconds, sampled uniformly per decision.
  delay_model_by_tom:
    0:
      perception: {min: 0.15, max: 0.6}
      decision:   {min: 0.1, max: 0.5}
      submit:     {min: 0.05, max: 0.3}
      report:     {min: 0.1, max: 0.5}
    1:
      perception: {min: 0.15, max: 0.6}
      decision:   {min: 0.1, max: 0.5}
      submit:     {min: 0.05, max: 0.3}
      report:     {min: 0.1, max: 0.5}
    2:
      perception: {min: 0.15, max: 0.6}
      decision:   {min: 0.1, max: 0.5}
      submit:     {min: 0.05, max: 0.3}
      report:     {min: 0.1, max: 0.5}

  tom_distribution:
    0: 0.33
    1: 0.33
    2: 0.33

# Agent initialization and decision settings
agent:
  cash_mode: power_law         # power_law or equal
  cash_min: 100000
  cash_max: 1000000
  cash_alpha: 1.16             # Lower values produce a heavier wealth tail
  cash_by_tom:
    0: {min: 100000, max: 1000000, alpha: 1.16}
    1: {min: 100000, max: 1000000, alpha: 1.16}
    2: {min: 100000, max: 1000000, alpha: 1.16}
  cash_equal_amount: 500000

  stock_ratio_min: 0.3         # Minimum initial stock share of total assets
  stock_ratio_max: 0.7         # Maximum initial stock share of total assets
  index_holding_file: data/agents_initial_holdings_100.json
  index_holding_prob_file: data/index_holding_prob.json
  index_holding_max: 4
  index_holding_min: 1
  min_holders_per_index: 15

  # Mean Poisson arrival interval in seconds; lower values trade more often.
  arrival_lambda:
    0: 1200
    1: 1200
    2: 1200

  tool_loop_max_steps: 2
  reasoning_maxlen: 500
  # Available actions: set_trade_plan, social_action, cancel_orders, set_deception_plan
  tool_allowlist_by_tom:
    0: [cancel_orders, social_action]
    1: [cancel_orders, social_action]
    2: [cancel_orders, social_action]

  technical_analysis:
    trade_lookback: 100
    sma_short_period: 5
    sma_long_period: 20
    rsi_period: 14
    rsi_overbought: 70
    rsi_oversold: 30
    momentum_period: 10

# Historical market data shown to agents
market_indices:
  enabled: true
  profile_csv: data/stock_profile.csv
  quotes_csv: data/stock_data.csv
  recent_days: 60              # History loaded before start_date
  start_date: "2023-06-15"
  baseline_flat_days: 0        # Initial flat-price days; 0 disables this behavior
  quotes_maxlen: 2000

# ================================================================
#  A 股交易制度（每条均可开关；缺省值 = 关闭 T+1 / 开启涨跌停 / 整手取 orderbook.lot_size / 禁止融券）
# ================================================================
market_rules:
  t_plus_one: true                 # T+1：当日买入的股份次日才能卖出（提示词持仓会标注“今买/可卖”）
  price_limit_enabled: true        # 涨跌停板：比例见 orderbook.price_limit_pct；关闭后价格不设上下限
  price_limit_rounding: round      # 涨跌停价取整：round = 交易所规则四舍五入到 0.01；outward = 向外取整
  price_limit_pct_by_symbol: {}    # 按标的覆盖比例，例如 {TTEI: 0.20}（科创/创业板 ±20%，ST ±5%）
  lot_size: 100                    # 整手：买入须为 100 股整数倍；卖出按整手，零股可一次性卖出；做市商播种也按整手
  allow_short_selling: false       # 融券限制：false = 只能卖出实际持有且可卖的股份；true = 允许融券卖出形成负持仓
  short_sell_max_ratio: 0.5        # 允许融券时，融券总市值上限 = 总资产 × 此比例

# Continuous double-auction order book
orderbook:
  seed_levels: 15
  seed_spread_pct: 0.002
  seed_max_qty: 100
  seed_min_qty: 20
  seed_qty_decay: 3
  seed_absorption_pct: 0.25
  max_trade_log: 50000
  tick_size: 0.01
  lot_size: 1
  price_limit_pct: 0.10
  order_ttl: 7200              # Two trading days
  buy_depth_cap: 1.0

# Social graph, feed ranking, and reputation
social:
  perception_hot_k: 2
  perception_latest_k: 3
  max_posts: 1000
  candidate_pool_min: 10
  recency_half_life: 3600.0
  post_content_maxlen: 300
  retweet_preview_len: 100

  graph_enabled: true
  # Separate promotion and demotion thresholds provide KOL hysteresis.
  kol_reputation_threshold: 5.0
  kol_reputation_loss_threshold: 3.0
  follow_random_min: 3
  follow_random_max: 5

  scoring:
    retweet_weight: 2
    engagement_coeff: 2.0
    recency_coeff: 5.0
    reputation_coeff: 2.0
    social_bonus: 3.0

  reputation_enabled: true
  reputation_eval_delay: 3600
  reputation_window: 10
  reputation_initial: 1.0
  reputation_neutral_threshold: 0.2
  reputation_min_window: 3
  reputation_max_pending: 50000
  reputation_correct_weight: 0.3
  reputation_wrong_weight: 0.3
  reputation_like_weight: 0.05
  reputation_dislike_weight: 0.05
  reputation_retweet_weight: 0.1
  reputation_decay_rate: 0.97

# Optional ToM-level evolution
evolution:
  enabled: false
  interval: 36000              # Evaluate every ten trading days
  win_rate_threshold: -0.05
  consecutive_rounds: 2
  max_upgrade_per_round: 10
  max_tom_level: 2

# Offline news injection
news_events_config:
  enabled: true
  news_day_offset_pct: 0.25    # Injection point within each trading day

  # Random-pool mode
  news_file: data/news.json
  news_per_day: 5
  coverage_cycle: 3

  # Calendar-aligned experimental mode
  experimental_daily_title_mode: false
  experimental_news_file: data/news2.json
  reopen_include_closed_days: true
  monday_include_weekend: true

prompt:
  social_max_posts: 5

# Run logs and checkpoints
storage:
  base_dir: runs
  buffer_size: 100
  store_prompt: false
  checkpoint_interval: 3600
  checkpoint_l2_keep: 200
  checkpoint_price_keep: 5000
  checkpoint_snapshot_keep: 20
  checkpoint_trade_log_limit: 2000

# Realtime dashboard
dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8765
  l2_depth: 10
  l2_quote_orders: 0
  trading_day_seconds: 3600
  max_recent_events: 200

  price_trend_maxlen: 600
  sentiment_trend_maxlen: 600
  deviation_trend_maxlen: 600
  sentiment_window: 500
  social_graph_top_n: 100

  # Real-market overlays for calendar-aligned mode
  real_index_curves_file: data/index_volatility_curves.json
  real_calendar_news_file: data/news2.json
  real_curve_include_closed_days: true

  ws_push_interval: 1.0
  ws_event_queue_size: 2000
  ws_heartbeat: 20.0

# OpenAI-compatible LLM providers
api:
  inference:
    temperature: 1.0           # Required by some providers, including Kimi K2.6
    max_tokens: 1024
    print_full_prompt: false
    debug_print: false
    colorized_print: false

  providers:
    - name: provider_1
      base_url: "<your-openai-compatible-api-base-url>"
      api_key: $MENTALMARKET_PROVIDER_1_API_KEY
      model: "<your-model-name>"
      max_concurrency: 20
      timeout: 60
      tool_choice: required    # required, auto, or none
      extra_body: {}

  routing:
    0: [provider_1]
    1: [provider_1]
    2: [provider_1]
